<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://qatt.org/css/site.css">
  <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap-icons/bootstrap-icons.min.css">

  <style>
    svg {
      stroke: currentColor;
      stroke-linecap: round;
      fill: transparent;
      vertical-align: baseline;
      display: inline-block;
      height: 2em;
      position: relative;
      top: -.25em;
    }
    code {
      display: inline-block;
      vertical-align: baseline;
      font-family: inherit;
      font-size: 1.5em;
      color: inherit;
    }
    .font-serif {
      font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', serif;
    }
    .font-monospace {
      font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', monospace;
    }
    .lh-sm {
      line-height: 1.1;
    }
    .badge-rank {
      font-weight: 400;
      border: 1px solid rgba(108, 117, 125, 0.5);
      color: #6c757d;
      font-size: 0.65rem;
      background: transparent;
    }
    #copy-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 9999;
      display: none;
      border: 1px solid #444;
    }
    .tile {
      transition: transform 0.15s, border-color 0.15s;
    }
    #discovery .nav-link:not(.active) .tab-count {
      display: none;
    }
    @media (max-width: 575.98px) {
      #discovery .nav-tabs {
        --bs-nav-link-padding-x: .6rem;
      }
    }
    /* Lange Inhalte kappen; Klick auf den Verlauf klappt auf */
    .clip-box { position: relative; }
    .clip-box.is-clipped { max-height: var(--clip-h); overflow: hidden; }
    .clip-more {
      display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 6.5rem;
      padding: 0 0 .25rem; border: 0; cursor: pointer; color: var(--bs-secondary-color);
      background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--paper) 20%, Canvas) 85%);
      flex-direction: column; align-items: center; justify-content: flex-end;
    }
    .clip-box.is-clipped > .clip-more { display: flex; }
    #shelf-teaser .works { grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); }   /* four cards in a row on a wide screen */
    .clip-more:hover { color: var(--ink); }
    /* Öffentliche Decks im Masonry-Stil: Spalten, Karten brechen nicht um */
    .deck-masonry { column-count: 2; column-gap: .75rem; }
    @media (min-width: 576px) { .deck-masonry { column-count: 3; } }
    @media (min-width: 992px) { .deck-masonry { column-count: 4; } }
    .deck-card { break-inside: avoid; margin-bottom: .75rem; display: block; color: inherit; text-decoration: none; overflow: hidden; background: color-mix(in srgb, Canvas 85%, transparent); border-color: var(--line) !important; }
    #public-decks .deck-card { color: var(--ink); }   /* a link, but not in the link colour of a theme (the id beats its rule) */
    .deck-card:hover { border-color: var(--cinnabar) !important; }
    .deck-card-img { display: block; width: 100%; height: auto; }
    .deck-card-img.deck-cover-ph { aspect-ratio: 1; }
    .tile:hover, .tile:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(var(--bs-primary-rgb), 0.6) !important;
    }
    /* Einzeln anklickbare Zeichen: box-shadow statt padding, damit nichts verrutscht */
    .nom-char {
      cursor: pointer;
    }
    .nom-char, .nom-char img {
      border-radius: .25rem;
      transition: background-color .15s, box-shadow .15s;
    }
    :is(#results, #modalBody) .nom-char:hover img,
    :is(#results, #modalBody) .nom-char:not(:has(img)):hover {
      background-color: color-mix(in srgb, #2fa4d6 25%, transparent);
      box-shadow: 0 0 0 .2rem color-mix(in srgb, #2fa4d6 25%, transparent);
    }
    :is(qatt-code, .qatt-glyph) {
      cursor: default;
      vertical-align: sub;
    }

    /* Logik zum Ausblenden von Quốc Ngữ */
    body.hide-qn .qn-text {
      display: none !important;
    }

    /* Styling für die Echtzeit-Suchvorschau */
    #results:not(:empty) { margin-top: 1rem; }
    #search-preview {
      display: none;
      align-items: center;
      justify-content: flex-start;
      border-left: none;
      min-width: 0;
      white-space: nowrap;
      padding-top: 0;
      padding-bottom: 0;
    }
    #search-preview:not(:empty) {
      display: flex;
      min-width: 40px;
      max-width: 30vw;
      overflow-x: auto;
    }
    #search-preview svg {
      height: 1.4em;
    }

    /* ---------- the skeleton of qatt.org: colours from the variables, the theme draws the rest ---------- */
    :root { --ink: #2b2118; --cinnabar: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; }
    body { color: var(--ink); background: #fffdf8; min-height: 100vh; }
    /* the header of the pages of qatt.org and the Chunom site (.hero): the look of the theme "classic"; other themes override it */
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; }
    .hero .han { color: var(--cinnabar); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .hero .han { font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', serif; }   /* Nôm characters outside the usual fonts */
    .hero .lead { max-width: 38rem; color: #4a3d30; }
    @media (max-width: 575.98px) { .hero .han { letter-spacing: .3em; } }
    .home-links { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; }
    @media (max-width: 575.98px) { .home-links { gap: .35rem; } .home-links .btn { --bs-btn-padding-x: .7rem; --bs-btn-padding-y: .2rem; --bs-btn-font-size: .85rem; padding: .2rem .7rem; } }   /* the search stays near the top */
    .card-box { padding: 1rem; background: #fffdf8; border: 1px solid var(--line); border-radius: .7rem; box-shadow: 0 .35rem 1rem rgba(60, 40, 20, .14); }
    .text-secondary { color: var(--muted) !important; }

    /* the search field: a pill like the search bar of qatt.org */
    .search-card .input-group { --bs-border-radius: 2rem; }
    .search-card .input-group-text { background: color-mix(in srgb, var(--paper) 70%, Canvas); border-color: var(--field); color: var(--muted); }
    .search-card .form-control { border-color: var(--field); background: Canvas; color: var(--ink); }
    .search-card .form-control:focus { border-color: var(--cinnabar); box-shadow: 0 0 0 .2rem rgba(168, 54, 42, .15); outline: none; }
    .search-card .form-check-input:checked { background-color: var(--cinnabar); border-color: var(--cinnabar); }
    #search-preview { background: color-mix(in srgb, #f3d99c 70%, Canvas) !important; border-color: var(--field) !important; color: var(--ink); }

    #discovery .nav-tabs { border-bottom-color: var(--line); }
    #discovery .nav-link { color: var(--muted); }
    #discovery .nav-link:hover { color: var(--ink); border-color: transparent transparent var(--line); }
    #discovery .nav-link.active { background: transparent; color: var(--ink); border-color: var(--line) var(--line) transparent; box-shadow: inset 0 2px 0 var(--cinnabar); }
    .tile { background: color-mix(in srgb, Canvas 85%, transparent); border-color: var(--line) !important; border-radius: .8rem !important; color: var(--ink); }
    .tile:hover, .tile:focus-visible { border-color: var(--cinnabar) !important; box-shadow: 0 .3rem 1rem rgba(60, 40, 20, .1); }

    #results .list-group-item { background: color-mix(in srgb, Canvas 85%, transparent); border: 1px solid var(--line); border-radius: .8rem !important; margin-bottom: .6rem; color: var(--ink); }
    #results .list-group-item-action:hover { background: Canvas; border-color: var(--cinnabar); }
    .badge-rank { border-color: var(--field); color: var(--muted); }

    #copy-toast { background: var(--ink); border-color: var(--ink); color: Canvas; }
  </style>
</head>

  <script>
// Kleiner DOM-Helfer: el('div', { className: 'x', 'data-copy': '…' }, kind, 'Text', [weitere]).
// Texte werden Textknoten, nie HTML; bekannte Properties direkt, alles andere (data-*, aria-*, role) per setAttribute.
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value == null || value === false) continue;
    if (key.includes('-') || !(key in node)) node.setAttribute(key, value); else node[key] = value;
  }
  node.append(...children.flat(Infinity).filter(child => child != null && child !== false && child !== ''));
  return node;
}


class ChunomDict {
  constructor(apiUrl, searchInputId, resultsContainerId, statusId) {
    this.apiUrl = apiUrl;
    this.searchInput = document.getElementById(searchInputId);
    this.searchPreview = document.getElementById('search-preview');
    this.resultsContainer = document.getElementById(resultsContainerId);
    this.discoveryContainer = document.getElementById('discovery');
    this.decksContainer = document.getElementById('public-decks');
    // Trefferliste auf die größere Bildschirmseite kappen
    this.resultsClip = this.clipContent(this.resultsContainer, () => Math.max(innerHeight, innerWidth));
    this.statusContainer = document.getElementById(statusId);
    this.qnToggle = document.getElementById('toggle-qn');
    this.telexToggle = document.getElementById('toggle-telex');

    // the popup of a character is shared with the other pages (js/detail.js)
    this.detail = ChunomDetail.get().configure({
      qattFont: 'QATT Pen Medium', // the glyphs are text of the Pen medium font (not SVG; a font that fonts.js offers to every visitor)
      urlFor: nom => this.linkUrl('detail', nom), // the link of the open popup can be shared
      onClose: () => this.updateUrl(this.searchInput.value.trim()), // the entry before the popup may still carry an older search term
      onQattClick: query => { // a glyph in the popup searches for its reading
        this.searchInput.value = query;
        this.search(query);
        this.detail.hide();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    this.qnHiddenKey = 'chunom_qn_hidden';
    this.telexKey = 'chunom_telex';
    this.data = [];
    // Früherer CSV-Cache; der HTTP-Cache genügt
    localStorage.removeItem('chunom_dict_data');
    localStorage.removeItem('chunom_dict_timestamp');

    this.initSettings();
    this.init();
    this.initGlobalClickHandlers();
  }
  initSettings() {
    const qnHidden = localStorage.getItem(this.qnHiddenKey) === 'true';
    this.qnToggle.checked = !qnHidden;
    if (qnHidden) document.body.classList.add('hide-qn');

    this.qnToggle.addEventListener('change', (e) => {
      const hidden = e.target.checked;
      localStorage.setItem(this.qnHiddenKey,! hidden);
      document.body.classList.toggle('hide-qn', !hidden);
    });

    // Telex-IME von chunom.org: standardmäßig an (gespeicherte Wahl hat Vorrang)
    const telex = localStorage.getItem(this.telexKey);
    this.telexToggle.checked = telex ? telex === 'true' : true;
    this.setTelex(this.telexToggle.checked);
    this.telexToggle.addEventListener('change', (e) => {
      localStorage.setItem(this.telexKey, e.target.checked);
      this.setTelex(e.target.checked);
    });
  }
  setTelex(on) {
    if (!window.VietIme) return;
    if (!this.ime) {
      // on phones the list closes itself after 10 seconds, so it does not cover the results for long
      const phone = matchMedia('(max-width: 575.98px)');
      this.ime = new VietIme(this.searchInput, { candidates: false, timeout: phone.matches ? 10000 : 0 });
      phone.addEventListener('change', () => this.ime.update({ timeout: phone.matches ? 10000 : 0 }));
      // Die Suche nutzt die Wörterbücher auch ohne Telex: beim ersten Fokus laden, dann um IME-Treffer ergänzen
      this.searchInput.addEventListener('focus', () => VietIme.load().then(() => {
        this.search(this.searchInput.value);
      }), { once: true });
    }
    this.ime.update({ telex: on, candidates: false });   // no candidate list in the search
  }

  // Verwandte Zeichen: Varianten, vereinfachte und traditionelle Formen (js/glyph_relations.json, siehe build_glyph_relations.py)
  initGlobalClickHandlers() {
    // Tippen irgendwo auf der Seite springt ins Suchfeld – nur sichtbare Zeichen, keine Tastenkürzel
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.isComposing) return;
      if (e.target === this.searchInput || document.body.classList.contains('modal-open')) return;
      if (e.key === 'Backspace' && !e.altKey && this.searchInput.value) {
        // wie im Feld: letztes Zeichen löschen (ganzer Codepunkt, z.B. 𥐉)
        e.preventDefault();
        this.searchInput.focus();
        this.searchInput.value = [...this.searchInput.value].slice(0, -1).join('');
        this.searchInput.dispatchEvent(new Event('input'));
      } else if (e.key == 'Enter') {
        this.searchInput.dispatchEvent(new KeyboardEvent('keydown', {
          key: 'Escape',
          code: 'Escape',
          keyCode: 27
        }));
      } else if (e.key.length === 1 && e.key !== ' ') {
        this.searchInput.focus();
      }
    });
    // Capture: a click on a character has priority over the clickable row or tile below it (in the popup detail.js does this)
    document.addEventListener('click', (e) => {
      const nomChar = !e.target.closest('#detailModal') && e.target.closest('.nom-char');
      if (!nomChar) return;
      e.stopPropagation();
      this.showDetails(null, nomChar.dataset.char);
    }, true);
  }

  // Per Tab erreichbar und per Klick, Enter oder Leertaste auszulösen
  makeActivatable(el, action) {
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.addEventListener('click', action);
    el.addEventListener('keydown', (e) => {
      if (e.target === el && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        action();
      }
    });
  }
  async init() {
    try {
      this.data = await ChunomDetail.loadData(this.apiUrl);
      this.finishLoading();
    } catch (err) {
      console.error("Fetch error", err);
      this.showError("Error loading data.");
    }
  }
  finishLoading() {
    this.statusContainer.classList.add('d-none');
    this.searchInput.removeAttribute('disabled');
    this.searchInput.addEventListener('input', () => this.search(this.searchInput.value));
    // type="search" leert das Feld bei Esc; es soll nur das IME-Fenster schließen
    this.searchInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') e.preventDefault(); });
    this.renderDiscoveryLists();
    // Link-fähig wie die alte App: ?search=... oder ?detail=<Zeichen>
    const params = new URLSearchParams(location.search);
    const search = params.get('search');
    let detail = params.get('detail');
    detail = detail && (this.codePointChar(detail) || detail);
    // Nur Nicht-ASCII (CJK usw.): Links sollen Zeichen öffnen, keinen beliebigen Text
    if (detail && /^[^\x00-\x7f]+$/.test(detail)) {
      // Basiseintrag ohne Parameter; das Popup legt seinen eigenen Eintrag an, Zurück schließt es
      history.replaceState(null, '', this.linkUrl());
      this.showDetails(null, detail);
    } else if (search) {
      this.searchInput.value = this.codePointChar(search, true) || search;
      this.searchInput.focus(); // startet auch das Laden der IME-Wörterbücher
      this.search(this.searchInput.value);
    }
  }

  // the popup and the elements of characters and glyphs are those of js/detail.js
  showDetails(clickedId, nom, row) { return this.detail.open(nom, clickedId, row); }
  nomChars(text, size) { return this.detail.nomChars(text, size); }
  qattCodes(quocNgu, fontSize) { return this.detail.qattCodes(quocNgu, fontSize); }

  // Codepunkt → Zeichen ("U+4E00" oder "4E00"), sonst null.
  // strict (Suche): ohne "U+" nur Han-Zeichen, sonst wäre es von Quốc Ngữ nicht eindeutig zu unterscheiden
  codePointChar(text, strict = false) {
    const cp = text.trim().match(/^(u\+)?([0-9a-f]{4,6})$/i);
    if (!cp || parseInt(cp[2], 16) > 0x10FFFF) return null;
    const char = String.fromCodePoint(parseInt(cp[2], 16));
    return !strict || cp[1] || /\p{Script=Han}/u.test(char) ? char : null;
  }

  // Adresse für Suche (?search=) oder Popup (?detail=), damit man den Link teilen kann
  linkUrl(param, value) {
    const url = new URL(location.href);
    url.search = '';
    if (value) url.searchParams.set(param, value);
    return url;
  }
  updateUrl(term) {
    history.replaceState(history.state, '', this.linkUrl('search', term));
  }

  renderDiscoveryLists() {
    const rank = r => parseInt(r[5]) || Infinity;
    const key = r => `${r[1]}|${r[0]}`;

    // Nach Rang sortiert (ohne Rang zuletzt), doppelte CSV-Zeilen (gleiches Zeichen und Lesung) nur einmal
    const sorted = rows => {
      const seen = new Set();
      return rows.sort((a, b) => rank(a) - rank(b)).filter(r => !seen.has(key(r)) && seen.add(key(r)));
    };
    // Top 100: die ersten 100 Einträge nach Rang, egal welches Level, auch gleichrangige
    const top100 = sorted(this.data.filter(r => parseInt(r[5]))).slice(0, 100);
    // Level-Tabs ohne die Top 100, damit jeder Eintrag in genau einem Tab steht.
    // Level steht in Spalte 3 (0 = ohne Level)
    const inTop100 = new Set(top100.map(key));
    const byLevel = (...levels) => sorted(this.data.filter(r => levels.includes(r[3]) && !inTop100.has(key(r))));

    // [id, Beschriftung, kurz fürs Handy, Einträge]
    const tabs = [
      ['top-100', 'Top 100 Frequent Words', 'Top 100', top100],
      ['level-2', 'Level 2', 'Level 2', byLevel('1', '2')],
      ['level-3', 'Level 3', 'Level 3', byLevel('3')],
      ['level-4', 'Level 4', 'Level 4', byLevel('4')]
    ];
    this.discoveryContainer.replaceChildren(
      // Auf schmalen Bildschirmen waagerecht scrollbar statt umbrechend
      el('ul', { className: 'nav nav-tabs flex-nowrap overflow-x-auto overflow-y-hidden mb-3', role: 'tablist' }, tabs.map(([id, label, short, rows], i) =>
        el('li', { className: 'nav-item', role: 'presentation' },
          el('button', {
            className: `nav-link text-nowrap${i ? '' : ' active'}`, id: `tab-${id}`, type: 'button', role: 'tab',
            'data-bs-toggle': 'tab', 'data-bs-target': `#pane-${id}`, 'aria-controls': `pane-${id}`, 'aria-selected': String(!i)
          }, short === label ? label : [el('span', { className: 'd-sm-none', textContent: short }), el('span', { className: 'd-none d-sm-inline', textContent: label })],
          // Anzahl, nur am aktiven Reiter sichtbar (CSS)
          el('span', { className: 'badge rounded-pill text-bg-secondary ms-2 tab-count', textContent: rows.length })))).concat(
        el('li', { className: 'nav-item ms-auto' },
          el('button', { className: 'nav-link text-secondary tabs-toggle d-none', type: 'button', title: 'Expand / collapse' }, el('i', { className: 'bi bi-chevron-down', 'aria-hidden': 'true' }))))),
      el('div', { className: 'tab-content' }, tabs.map(([id, , , rows], i) =>
        el('div', { className: `tab-pane fade${i ? '' : ' show active'}`, id: `pane-${id}`, role: 'tabpanel', 'aria-labelledby': `tab-${id}` },
          el('div', { className: 'row row-cols-4 row-cols-sm-5 row-cols-md-8 row-cols-lg-10 g-2' }, rows.map(r => this.createTile(r)))))));
    // Auf 50vh kappen; ein Reiterwechsel zeigt alles
    const toggle = this.discoveryContainer.querySelector('.tabs-toggle');
    const tabClip = this.clipContent(this.discoveryContainer.querySelector('.tab-content'), () => innerHeight * 0.5, ({ clipped, clippable }) => {
      toggle.classList.toggle('d-none', !clippable);
      toggle.querySelector('i').className = `bi bi-chevron-${clipped ? 'down' : 'up'}`;
      toggle.setAttribute('aria-label', clipped ? 'Expand' : 'Collapse');
    });
    toggle.addEventListener('click', () => tabClip.isClipped() ? tabClip.open() : tabClip.close());
    this.discoveryContainer.querySelector('.nav-tabs').addEventListener('show.bs.tab', () => tabClip.open());
    // Bootstrap richtet die Pfeiltasten nur für Tabs ein, die beim Laden schon existieren
    if (window.bootstrap) bootstrap.Tab.getOrCreateInstance(this.discoveryContainer.querySelector('.nav-link.active'));
  }
  // Öffentliche Decks aus Supabase als Karten: Bild, Titel, Anzahl · Autor bzw. chunom.org
  async loadPublicDecks() {
    if (typeof SupabaseService === 'undefined' || !window.DeckCover) return; // class declarations are not on window
    const sp = new SupabaseService();
    await sp.init();
    const decks = await sp.getPublicDecks();
    if (!decks.length) return;
    const owners = await sp.getUsernames?.(decks.filter(d => !d.is_official).map(d => d.user_id)) || {};
    this.decksContainer.querySelector('.deck-masonry').replaceChildren(...decks.map(d =>
      el('a', { className: 'deck-card rounded border border-secondary border-opacity-25 shadow-sm', href: `decks/deck.html?id=${encodeURIComponent(d.id)}` },
        DeckCover.element(d, sp.deckImageUrl(d.image_path), 'deck-card-img'),
        el('div', { className: 'p-2' },
          el('div', { className: 'fw-semibold', textContent: d.title }),
          el('small', { className: 'text-secondary' },
            `${d.words ? d.words.length : (d.count || 0)} items · `,
            d.is_official ? el('span', { className: 'badge text-bg-warning', textContent: 'chunom.org' }) : `by ${owners[d.user_id] || 'a user'}`)))));
    if (!this.searchInput.value.trim()) this.decksContainer.classList.remove('d-none');
  }
  // Kappt content auf limit() Pixel; Verlauf mit „show more“ klappt auf. Gibt { open, close, reset } zurück; onState({ clipped, clippable }) meldet Änderungen.
  clipContent(content, limit, onState = () => {}) {
    const box = el('div', { className: 'clip-box' });
    content.replaceWith(box);
    const more = el('button', { className: 'clip-more', type: 'button', 'aria-label': 'Show more' },
      el('span', { className: 'btn btn-sm btn-quiet', textContent: 'show more' }),
      el('i', { className: 'bi bi-chevron-compact-down fs-3', 'aria-hidden': 'true' }));
    box.append(content, more);
    let opened = false;
    const update = () => {
      const max = limit();
      box.style.setProperty('--clip-h', `${max}px`);
      const clippable = content.offsetHeight > max + 40;
      box.classList.toggle('is-clipped', clippable && !opened);
      onState({ clipped: clippable && !opened, clippable });
    };
    const open = () => { opened = true; update(); };
    const close = () => { opened = false; update(); };
    more.addEventListener('click', open);
    if (window.ResizeObserver) new ResizeObserver(update).observe(content);
    window.addEventListener('resize', update);
    update();
    return { open, close, reset: close, isClipped: () => box.classList.contains('is-clipped') };
  }
  createTile(r) {
    const tile = el('div', { className: 'pt-4 p-2 rounded text-center h-100 d-flex flex-column justify-content-center border border-secondary border-opacity-25 position-relative shadow-sm tile', style: 'cursor: pointer' },
      r[5] && el('span', { className: 'position-absolute top-0 start-0 m-1 badge badge-rank', style: 'opacity: 0.8', textContent: `#${r[5]}` }),
      el('div', { className: 'h3 font-serif mb-0' }, this.nomChars(r[1], 50)),
      el('div', { className: 'd-flex align-items-center justify-content-center gap-1 mt-1 overflow-hidden flex-wrap' }, this.qattCodes(r[0], '0.7rem')),
      el('div', { className: 'text-secondary small opacity-75 text-truncate w-100 qn-text', lang: 'vi', textContent: r[0] }));
    this.makeActivatable(tile, () => this.showDetails(r[5], r[1]));
    return el('div', { className: 'col' }, tile);
  }
  showError(msg) {
    this.statusContainer.replaceChildren(el('span', { className: 'text-danger small', textContent: msg }));
  }
  search(term) {
    const query = this.codePointChar(term, true) || term.trim().toLowerCase();
    // Bei offenem Popup gehört die Adresse dem Popup; nach dem Schließen setzt popstate sie
    if (!history.state?.modalOpen) this.updateUrl(term.trim());

    if (this.searchPreview) {
      const codes = query && !/[一-鿿]/.test(query) ? this.qattCodes(query, '1.4em') : [];
      this.searchPreview.replaceChildren(...codes);
      this.searchInput.style.borderRight = codes.length ? 'none' : '';
    }

    this.resultsContainer.replaceChildren();

    if (!query) {
      this.discoveryContainer.classList.remove('d-none');
      if (this.decksContainer.querySelector('.deck-card')) this.decksContainer.classList.remove('d-none');
      return;
    }

    this.discoveryContainer.classList.add('d-none');
    this.decksContainer.classList.add('d-none');

    // Quốc Ngữ nur ab Silbenanfang (auch in Komposita), Nôm als Teilstring
    const rows = this.data.filter(row => (' ' + row[0].toLowerCase()).includes(' ' + query) || row[1].includes(query));
    // Treffer aus den IME-Wörterbüchern (Nôm-Suche rückwärts); neu ist ein Treffer nur, wenn seine Zeichen noch nicht gelistet sind
    const imeLookup = /\p{Script=Han}/u.test(query) ? window.VietIme?.lookupGlyph : window.VietIme?.lookup;
    if (imeLookup) {
      const shown = new Set(rows.map(row => row[1]));
      for (const { glyph, reading, definition } of imeLookup(query)) {
        if (!shown.has(glyph)) rows.push([reading, glyph, definition]);
      }
    }
    // Exakte Aussprache zuerst, dann mit Beschreibung, dann der Rest – jeweils nach Rang (ohne Rang zuletzt), dann kürzere Aussprache
    const group = row => row[0].trim().toLowerCase() === query || row[1] === query ? 0 : row[2] ? 1 : 2;
    const rank = row => parseInt(row[5]) || Infinity;
    rows.sort((a, b) => group(a) - group(b) || rank(a) - rank(b) || a[0].trim().length - b[0].trim().length);

    this.resultsContainer.append(...rows.slice(0, 80).map(row => this.createResultItem(row)));
    this.resultsClip.reset();
  }
  createResultItem(row) {
    const [quocNgu, nom, meaning, id] = [row[0], row[1], row[2], row[5]];
    const item = el('div', { className: 'list-group-item list-group-item-action py-3' },
      el('div', { className: 'd-flex w-100 align-items-center mb-1' },
        el('div', { className: 'me-auto d-flex align-items-center' },
          el('span', { className: 'fs-2 me-2' }, this.nomChars(nom)),
          el('span', { className: 'text-secondary fw-bold qn-text', lang: 'vi', textContent: quocNgu })),
        el('div', { className: 'text-end d-flex align-items-center gap-2 flex-wrap justify-content-end' }, this.qattCodes(quocNgu))),
      el('div', { className: 'd-flex justify-content-between align-items-center w-100' },
        el('p', { className: 'mb-0 text-secondary small text-truncate flex-grow-1', textContent: meaning }),
        id && el('span', { className: 'badge badge-rank ms-2', textContent: `#${id}` })));
    this.makeActivatable(item, () => this.showDetails(id, nom, row));
    return item;
  }
}
let dict;

window.addEventListener("load", () => {
  try {
    dict = new ChunomDict('/chunom/dict.csv', 'search', 'results', 'dict-status');
    dict.loadPublicDecks().catch(e => console.error('Public decks failed', e));
  } catch (e) {
    console.error("Initialization error", e);
  }
});
  </script>
