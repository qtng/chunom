<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chunom.org</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
  <link rel="stylesheet" href="https://chunom.org/media/css/fonts/all.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script defer src="https://qatt.org/chunom/js/ime.js"></script>
  <script defer src="https://qatt.org/qatt/js/navigation.js"></script>
  <script defer src="https://qatt.org/qatt/js/qatt.js"></script>
  <script defer src="https://qatt.org/qatt/js/parser.js"></script>
  <style>
    svg {
      stroke: currentColor;
      stroke-linecap: round;
      fill: transparent;
      vertical-align: baseline;
      display: inline-block;
      height: 2em;
      position: relative;
      top: -.25em;
    }
    code {
      display: inline-block;
      vertical-align: baseline;
      font-family: inherit;
      font-size: 1.5em;
      color: inherit;
    }
    .glyph-box {
      min-width: 120px;
      height: 160px;
      flex-shrink: 0;
    }
    .font-serif {
      font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', serif;
    }
    .font-monospace {
      font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', monospace;
    }
    .lh-sm {
      line-height: 1.1;
    }
    .badge-rank {
      font-weight: 400;
      border: 1px solid rgba(108, 117, 125, 0.5);
      color: #6c757d;
      font-size: 0.65rem;
      background: transparent;
    }
    #copy-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 9999;
      display: none;
      border: 1px solid #444;
    }
    .tile {
      transition: transform 0.15s, border-color 0.15s;
      background: papayawhip;
    }
    #discovery .nav-link:not(.active) .tab-count {
      display: none;
    }
    @media (max-width: 575.98px) {
      #discovery .nav-tabs {
        --bs-nav-link-padding-x: .6rem;
      }
    }
    .tile:hover, .tile:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(var(--bs-primary-rgb), 0.6) !important;
    }
    /* Einzeln anklickbare Zeichen: box-shadow statt padding, damit nichts verrutscht */
    .nom-char {
      cursor: pointer;
    }
    .nom-char, .nom-char img {
      border-radius: .25rem;
      transition: background-color .15s, box-shadow .15s;
    }
    :is(#results, #modalBody) .nom-char:hover img,
    :is(#results, #modalBody) .nom-char:not(:has(img)):hover {
      background-color: var(--bs-info-bg-subtle);
      box-shadow: 0 0 0 .2rem var(--bs-info-bg-subtle);
    }
    .clickable-meta {
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .clickable-meta:hover {
      opacity: 1 !important;
      text-decoration: underline;
    }
    #detailModal qatt-code {
      cursor: pointer;
      transition: filter 0.2s;
    }
    #detailModal qatt-code:hover {
      filter: brightness(1.3);
    }
    qatt-code {
      cursor: default;
      vertical-align: sub;
    }

    /* Logik zum Ausblenden von Quốc Ngữ */
    body.hide-qn .qn-text {
      display: none !important;
    }

    /* Styling für die Echtzeit-Suchvorschau */
    #search-preview {
      display: none;
      align-items: center;
      justify-content: flex-start;
      border-left: none;
      min-width: 0;
      white-space: nowrap;
      padding-top: 0;
      padding-bottom: 0;
    }
    #search-preview:not(:empty) {
      display: flex;
      min-width: 40px;
      max-width: 30vw;
      overflow-x: auto;
    }
    #search-preview svg {
      height: 1.4em;
    }
    #search:focus {
      box-shadow: none;
      outline: none;
      border-color: #ddd;
    }
  </style>
</head>
<body class="bg-light">
  <div id="copy-toast">Copied</div>

  <div class="container mt-4">

    <div class="mt-4 alert alert-secondary">
      <div class="mb-3 d-flex justify-content-between align-items-center">
        <!-- Toggle für Quốc Ngữ ausblenden -->
        <div class="d-inline-flex">
          <div class="form-check form-switch small mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="toggle-qn">
            <label class="form-check-label text-secondary" for="toggle-qn">Show Quốc Ngữ</label>
          </div>
          <div class="ms-3 form-check form-switch small mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="toggle-telex">
            <label class="form-check-label text-secondary" for="toggle-telex">Telex</label>
          </div>
        </div>
        <button id="bookmarks-btn" type="button" class="btn btn-sm btn-link" disabled>My Bookmarks</button>
      </div>
      <div class="input-group">
        <label class="input-group-text" for="search">Search</label>
        <input type="search" id="search" class="form-control" disabled>
        <div id="search-preview" class="input-group-text bg-warning border"></div>
        <div id="dict-status" class="input-group-text">
          <div class="spinner-border spinner-border-sm text-info" role="status"></div>
        </div>
      </div>
    </div>

    <!-- Tabs nach Rang und Level, aufgebaut in renderDiscoveryLists() -->
    <div id="discovery" class="mt-4 mb-5"></div>

    <div id="bookmarks-title" class="d-none mt-4 alert alert-light shadow-sm py-1 border-0 text-uppercase fw-bold">My Bookmarks</div>
    <div id="results" class="list-group w-100"></div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true" aria-labelledby="modalTitle">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Details</h5>
          <div class="d-flex align-items-center">
            <button type="button" id="bookmark-toggle" class="btn p-0 border-0 text-danger" aria-label="Bookmark" aria-pressed="false"><i class="bi bi-heart"></i></button>
            <button type="button" class="ms-4 btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script>
// Kleiner DOM-Helfer: el('div', { className: 'x', 'data-copy': '…' }, kind, 'Text', [weitere]).
// Texte werden Textknoten, nie HTML; bekannte Properties direkt, alles andere (data-*, aria-*, role) per setAttribute.
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value == null || value === false) continue;
    if (key.includes('-') || !(key in node)) node.setAttribute(key, value); else node[key] = value;
  }
  node.append(...children.flat(Infinity).filter(child => child != null && child !== false && child !== ''));
  return node;
}

const NOM_CHAR = /[一-鿿㐀-䶿\u{20000}-\u{323af}]/u;

class ChunomDict {
  constructor(apiUrl, searchInputId, resultsContainerId, statusId) {
    this.apiUrl = apiUrl;
    this.searchInput = document.getElementById(searchInputId);
    this.searchPreview = document.getElementById('search-preview');
    this.resultsContainer = document.getElementById(resultsContainerId);
    this.discoveryContainer = document.getElementById('discovery');
    this.statusContainer = document.getElementById(statusId);
    this.toast = document.getElementById('copy-toast');
    this.qnToggle = document.getElementById('toggle-qn');
    this.telexToggle = document.getElementById('toggle-telex');

    const modalEl = document.getElementById('detailModal');
    if (typeof bootstrap !== 'undefined') {
      this.modal = new bootstrap.Modal(modalEl);
    }
    this.modalBody = document.getElementById('modalBody');

    this.qnHiddenKey = 'chunom_qn_hidden';
    this.telexKey = 'chunom_telex';
    this.data = [];
    // Früherer CSV-Cache; der HTTP-Cache genügt
    localStorage.removeItem('chunom_dict_data');
    localStorage.removeItem('chunom_dict_timestamp');

    this.initSettings();
    this.initBookmarks();
    this.initHistoryHandler(modalEl);
    this.init();
    this.initGlobalClickHandlers();
  }

  initSettings() {
    const qnHidden = localStorage.getItem(this.qnHiddenKey) === 'true';
    this.qnToggle.checked = !qnHidden;
    if (qnHidden) document.body.classList.add('hide-qn');

    this.qnToggle.addEventListener('change', (e) => {
      const hidden = e.target.checked;
      localStorage.setItem(this.qnHiddenKey,! hidden);
      document.body.classList.toggle('hide-qn', !hidden);
    });

    // Telex-IME von chunom.org: auf Touch-Geräten standardmäßig aus
    const telex = localStorage.getItem(this.telexKey);
    this.telexToggle.checked = telex ? telex === 'true' : !matchMedia('(pointer: coarse)').matches;
    this.setTelex(this.telexToggle.checked);
    this.telexToggle.addEventListener('change', (e) => {
      localStorage.setItem(this.telexKey, e.target.checked);
      this.setTelex(e.target.checked);
    });
  }

  setTelex(on) {
    if (!window.VietIme) return;
    if (!this.ime) {
      this.ime = new VietIme(this.searchInput, { defer: true, fontList: ['nom na tong supplement'] });
      // Die Suche nutzt die Wörterbücher auch ohne Telex: beim ersten Fokus laden, dann um IME-Treffer ergänzen
      this.searchInput.addEventListener('focus', () => VietIme.load().then(() => {
        if (!this.showingBookmarks) this.search(this.searchInput.value);
      }), { once: true });
    }
    this.ime.update({ telex: on, candidates: on });
  }

  initBookmarks() {
    this.bookmarksKey = 'chunom_bookmarks';
    this.bookmarks = JSON.parse(localStorage.getItem(this.bookmarksKey) || '[]');
    this.bookmarkToggle = document.getElementById('bookmark-toggle');
    this.bookmarksBtn = document.getElementById('bookmarks-btn');
    this.bookmarksTitle = document.getElementById('bookmarks-title');
    this.bookmarkToggle.addEventListener('click', () => {
      this.toggleBookmark(this.currentNom);
      this.bookmarkToggle.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.5)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'ease-out' });
    });
    this.bookmarksBtn.addEventListener('click', () => this.showingBookmarks ? this.search(this.searchInput.value) : this.showBookmarks());
  }

  toggleBookmark(nom) {
    const i = this.bookmarks.indexOf(nom);
    if (i < 0) this.bookmarks.unshift(nom); else this.bookmarks.splice(i, 1);
    localStorage.setItem(this.bookmarksKey, JSON.stringify(this.bookmarks));
    this.updateBookmarkUi();
    if (this.showingBookmarks) this.showBookmarks();
  }

  updateBookmarkUi() {
    const bookmarked = this.bookmarks.includes(this.currentNom);
    this.bookmarkToggle.querySelector('i').className = `bi ${bookmarked ? 'bi-heart-fill' : 'bi-heart'}`;
    this.bookmarkToggle.setAttribute('aria-pressed', bookmarked);
    this.bookmarksBtn.disabled = !this.bookmarks.length;
  }

  showBookmarks() {
    if (!this.bookmarks.length) return this.search(this.searchInput.value);
    this.discoveryContainer.classList.add('d-none');
    this.bookmarksTitle.classList.remove('d-none');
    this.showingBookmarks = true;
    this.bookmarksBtn.classList.add('active');
    // Zeichen, die nur in Komposita vorkommen, haben keine eigene Zeile
    this.resultsContainer.replaceChildren(...this.bookmarks.flatMap(nom => {
      const rows = this.data.filter(r => r[1] === nom);
      return (rows.length ? rows : [['', nom, '', '']]).map(r => this.createResultItem(r, true));
    }));
  }

  initHistoryHandler(modalEl) {
    window.addEventListener('popstate', () => {
      if (this.modal) this.modal.hide();
      // Der Eintrag vor dem Popup kann noch einen älteren Suchbegriff tragen
      this.updateUrl(this.searchInput.value.trim());
    });
    // Nach dem Schließen zurück zum auslösenden Element, damit man per Tastatur weitermachen kann
    modalEl.addEventListener('show.bs.modal', () => { this.returnFocus = document.activeElement; });
    modalEl.addEventListener('hidden.bs.modal', () => {
      if (history.state && history.state.modalOpen) {
        history.back();
      }
      this.returnFocus?.focus();
    });
  }

  initGlobalClickHandlers() {
    // Tippen irgendwo auf der Seite springt ins Suchfeld – nur sichtbare Zeichen, keine Tastenkürzel
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.isComposing) return;
      if (e.target === this.searchInput || document.body.classList.contains('modal-open')) return;
      if (e.key === 'Backspace' && !e.altKey && this.searchInput.value) {
        // wie im Feld: letztes Zeichen löschen (ganzer Codepunkt, z.B. 𥐉)
        e.preventDefault();
        this.searchInput.focus();
        this.searchInput.value = [...this.searchInput.value].slice(0, -1).join('');
        this.searchInput.dispatchEvent(new Event('input'));
      } else if (e.key.length === 1 && e.key !== ' ') {
        this.searchInput.focus();
      }
    });
    // Capture: diese Klicks haben Vorrang vor der anklickbaren Zeile bzw. Kachel darunter
    document.addEventListener('click', (e) => {
      const tt = e.target.closest('qatt-code');
      if (tt && tt.title && e.target.closest('#detailModal')) {
        e.stopPropagation();
        const query = tt.title.toLowerCase();
        this.searchInput.value = query;
        this.search(query);
        if (this.modal) this.modal.hide();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      const nomChar = e.target.closest('.nom-char');
      if (nomChar) {
        e.stopPropagation();
        this.showDetails(null, nomChar.dataset.char);
        return;
      }
      const copy = e.target.closest('[data-copy]');
      if (copy) this.copyText(copy.dataset.copy, copy);
    }, true);
  }

  // Per Tab erreichbar und per Klick, Enter oder Leertaste auszulösen
  makeActivatable(el, action) {
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.addEventListener('click', action);
    el.addEventListener('keydown', (e) => {
      if (e.target === el && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        action();
      }
    });
  }

  async init() {
    try {
      const response = await fetch(this.apiUrl);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      this.data = this.parseCSV(await response.text());
      this.finishLoading();
    } catch (err) {
      console.error("Fetch error", err);
      this.showError("Error loading data.");
    }
  }

  parseCSV(text) {
    const rows = [];
    const lines = text.split(/\r?\n/);
    for (let line of lines) {
      if (!line.trim()) continue;
      const row = [];
      let cell = '', inQuotes = false;
      for (let char of line) {
        if (char === '"') inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) {
          row.push(cell.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
          cell = '';
        } else cell += char;
      }
      row.push(cell.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
      if (row.length >= 2) rows.push(row);
    }
    return rows;
  }

  finishLoading() {
    this.statusContainer.classList.add('d-none');
    this.searchInput.removeAttribute('disabled');
    this.searchInput.addEventListener('input', () => this.search(this.searchInput.value));
    // type="search" leert das Feld bei Esc; es soll nur das IME-Fenster schließen
    this.searchInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') e.preventDefault(); });
    this.renderDiscoveryLists();
    this.updateBookmarkUi();
    // Link-fähig wie die alte App: ?search=... oder ?detail=<Zeichen>
    const params = new URLSearchParams(location.search);
    const search = params.get('search');
    let detail = params.get('detail');
    detail = detail && (this.codePointChar(detail) || detail);
    // Nur Nicht-ASCII (CJK usw.): Links sollen Zeichen öffnen, keinen beliebigen Text
    if (detail && /^[^\x00-\x7f]+$/.test(detail)) {
      // Basiseintrag ohne Parameter; das Popup legt seinen eigenen Eintrag an, Zurück schließt es
      history.replaceState(null, '', this.linkUrl());
      this.showDetails(null, detail);
    } else if (search) {
      this.searchInput.value = this.codePointChar(search, true) || search;
      this.searchInput.focus(); // startet auch das Laden der IME-Wörterbücher
      this.search(this.searchInput.value);
    }
  }

  // Codepunkt → Zeichen ("U+4E00" oder "4E00"), sonst null.
  // strict (Suche): ohne "U+" nur Han-Zeichen, sonst wäre es von Quốc Ngữ nicht eindeutig zu unterscheiden
  codePointChar(text, strict = false) {
    const cp = text.trim().match(/^(u\+)?([0-9a-f]{4,6})$/i);
    if (!cp || parseInt(cp[2], 16) > 0x10FFFF) return null;
    const char = String.fromCodePoint(parseInt(cp[2], 16));
    return !strict || cp[1] || /\p{Script=Han}/u.test(char) ? char : null;
  }

  // Adresse für Suche (?search=) oder Popup (?detail=), damit man den Link teilen kann
  linkUrl(param, value) {
    const url = new URL(location.href);
    url.search = '';
    if (value) url.searchParams.set(param, value);
    return url;
  }

  updateUrl(term) {
    history.replaceState(history.state, '', this.linkUrl('search', term));
  }

  // QATT-Elemente je Silbe; qatt.js rendert sie per MutationObserver
  qattCodes(quocNgu, fontSize = 'inherit') {
    const codes = [];
    for (const word of (quocNgu && parser ? quocNgu.split(/\s+/) : [])) {
      const parsed = word && parser.parse(word);
      if (parsed) codes.push(' ', el('qatt-code', { title: word, style: `font-size: ${fontSize}`, textContent: parsed.code }));
    }
    return codes.slice(1);
  }

  // Nôm-Zeichen als chunom.org-Bild (Schrift als Ersatz), einzeln anklickbar
  nomChars(text, size) {
    return [...(text || '')].map(ch => {
      if (!NOM_CHAR.test(ch)) return ch;
      if (!size) size = 32;
      const imgSize = size > 40 ? 220 : 32;
      const hex = ch.codePointAt(0).toString(16).toUpperCase();
      return el('span', { className: 'font-serif nom-char', 'data-char': ch },
        this.image([`https://chunom.org/media/generated/${hex}-${imgSize}.png`], { alt: ch, width: size, height: size, loading: 'lazy', style: 'vertical-align: middle' }, () => ch));
    });
  }

  // Bild mit Ersatzquellen; scheitern alle, ersetzt fallback() das Bild. onError läuft bei jedem Fehlschlag.
  image(sources, attrs, fallback, onError) {
    if (!sources.length) return fallback();
    const img = el('img', attrs);
    let i = 0;
    img.addEventListener('error', () => {
      onError?.(img);
      if (++i < sources.length) img.src = sources[i]; else img.replaceWith(fallback());
    });
    img.src = sources[0];
    return img;
  }

  renderDiscoveryLists() {
    const rank = r => parseInt(r[5]) || Infinity;
    const key = r => `${r[1]}|${r[0]}`;

    // Nach Rang sortiert (ohne Rang zuletzt), doppelte CSV-Zeilen (gleiches Zeichen und Lesung) nur einmal
    const sorted = rows => {
      const seen = new Set();
      return rows.sort((a, b) => rank(a) - rank(b)).filter(r => !seen.has(key(r)) && seen.add(key(r)));
    };
    // Top 100: die ersten 100 Einträge nach Rang, egal welches Level, auch gleichrangige
    const top100 = sorted(this.data.filter(r => parseInt(r[5]))).slice(0, 100);
    // Level-Tabs ohne die Top 100, damit jeder Eintrag in genau einem Tab steht.
    // Level steht in Spalte 3 (0 = ohne Level)
    const inTop100 = new Set(top100.map(key));
    const byLevel = (...levels) => sorted(this.data.filter(r => levels.includes(r[3]) && !inTop100.has(key(r))));

    // [id, Beschriftung, kurz fürs Handy, Einträge]
    const tabs = [
      ['top-100', 'Top 100 Frequent Words', 'Top 100', top100],
      ['level-2', 'Level 2', 'Level 2', byLevel('1', '2')],
      ['level-3', 'Level 3', 'Level 3', byLevel('3')],
      ['level-4', 'Level 4', 'Level 4', byLevel('4')]
    ];
    this.discoveryContainer.replaceChildren(
      // Auf schmalen Bildschirmen waagerecht scrollbar statt umbrechend
      el('ul', { className: 'nav nav-tabs flex-nowrap overflow-x-auto overflow-y-hidden mb-3', role: 'tablist' }, tabs.map(([id, label, short, rows], i) =>
        el('li', { className: 'nav-item', role: 'presentation' },
          el('button', {
            className: `nav-link text-nowrap${i ? '' : ' active'}`, id: `tab-${id}`, type: 'button', role: 'tab',
            'data-bs-toggle': 'tab', 'data-bs-target': `#pane-${id}`, 'aria-controls': `pane-${id}`, 'aria-selected': String(!i)
          }, short === label ? label : [el('span', { className: 'd-sm-none', textContent: short }), el('span', { className: 'd-none d-sm-inline', textContent: label })],
          // Anzahl, nur am aktiven Reiter sichtbar (CSS)
          el('span', { className: 'badge rounded-pill text-bg-secondary ms-2 tab-count', textContent: rows.length }))))),
      el('div', { className: 'tab-content' }, tabs.map(([id, , , rows], i) =>
        el('div', { className: `tab-pane fade${i ? '' : ' show active'}`, id: `pane-${id}`, role: 'tabpanel', 'aria-labelledby': `tab-${id}` },
          el('div', { className: 'row row-cols-4 row-cols-sm-5 row-cols-md-8 row-cols-lg-10 g-2' }, rows.map(r => this.createTile(r)))))));
    // Bootstrap richtet die Pfeiltasten nur für Tabs ein, die beim Laden schon existieren
    if (window.bootstrap) bootstrap.Tab.getOrCreateInstance(this.discoveryContainer.querySelector('.nav-link.active'));
  }

  createTile(r) {
    const tile = el('div', { className: 'pt-4 p-2 rounded text-center h-100 d-flex flex-column justify-content-center border border-secondary border-opacity-25 position-relative shadow-sm tile', style: 'cursor: pointer' },
      r[5] && el('span', { className: 'position-absolute top-0 start-0 m-1 badge badge-rank', style: 'opacity: 0.8', textContent: `#${r[5]}` }),
      el('div', { className: 'h3 font-serif mb-0' }, this.nomChars(r[1], 50)),
      el('div', { className: 'd-flex align-items-center justify-content-center gap-1 mt-1 overflow-hidden flex-wrap' }, this.qattCodes(r[0], '0.7rem')),
      el('div', { className: 'text-secondary small opacity-75 text-truncate w-100 qn-text', lang: 'vi', textContent: r[0] }));
    this.makeActivatable(tile, () => this.showDetails(r[5], r[1]));
    return el('div', { className: 'col' }, tile);
  }

  showError(msg) {
    this.statusContainer.replaceChildren(el('span', { className: 'text-danger small', textContent: msg }));
  }

  search(term) {
    const query = this.codePointChar(term, true) || term.trim().toLowerCase();
    // Bei offenem Popup gehört die Adresse dem Popup; nach dem Schließen setzt popstate sie
    if (!history.state?.modalOpen) this.updateUrl(term.trim());
    this.showingBookmarks = false;
    this.bookmarksBtn.classList.remove('active');
    this.bookmarksTitle.classList.add('d-none');

    if (this.searchPreview) {
      const codes = query && !/[一-鿿]/.test(query) ? this.qattCodes(query, '1.4em') : [];
      this.searchPreview.replaceChildren(...codes);
      this.searchInput.style.borderRight = codes.length ? 'none' : '';
    }

    this.resultsContainer.replaceChildren();

    if (!query) {
      this.discoveryContainer.classList.remove('d-none');
      return;
    }

    this.discoveryContainer.classList.add('d-none');

    // Quốc Ngữ nur ab Silbenanfang (auch in Komposita), Nôm als Teilstring
    const rows = this.data.filter(row => (' ' + row[0].toLowerCase()).includes(' ' + query) || row[1].includes(query));
    // Treffer aus den IME-Wörterbüchern (Nôm-Suche rückwärts); neu ist ein Treffer nur, wenn seine Zeichen noch nicht gelistet sind
    const imeLookup = /\p{Script=Han}/u.test(query) ? window.VietIme?.lookupGlyph : window.VietIme?.lookup;
    if (imeLookup) {
      const shown = new Set(rows.map(row => row[1]));
      for (const { glyph, reading, definition } of imeLookup(query)) {
        if (!shown.has(glyph)) rows.push([reading, glyph, definition]);
      }
    }
    // Exakte Aussprache zuerst, dann mit Beschreibung, dann der Rest – jeweils nach Rang (ohne Rang zuletzt), dann kürzere Aussprache
    const group = row => row[0].trim().toLowerCase() === query || row[1] === query ? 0 : row[2] ? 1 : 2;
    const rank = row => parseInt(row[5]) || Infinity;
    rows.sort((a, b) => group(a) - group(b) || rank(a) - rank(b) || a[0].trim().length - b[0].trim().length);

    this.resultsContainer.append(...rows.slice(0, 80).map(row => this.createResultItem(row)));
  }

  createResultItem(row, removable = false) {
    const [quocNgu, nom, meaning, id] = [row[0], row[1], row[2], row[5]];
    const item = el('div', { className: 'list-group-item list-group-item-action py-3' },
      el('div', { className: 'd-flex w-100 align-items-center mb-1' },
        el('div', { className: 'me-auto d-flex align-items-center' },
          el('span', { className: 'fs-2 me-2' }, this.nomChars(nom)),
          el('span', { className: 'text-secondary fw-bold qn-text', lang: 'vi', textContent: quocNgu })),
        el('div', { className: 'text-end d-flex align-items-center gap-2 flex-wrap justify-content-end' }, this.qattCodes(quocNgu)),
        removable && el('button', {
          type: 'button', className: 'btn p-0 border-0 text-secondary ms-3 remove-bookmark', title: 'Remove', 'aria-label': 'Remove bookmark',
          onclick: (e) => { e.stopPropagation(); this.toggleBookmark(nom); }
        }, el('i', { className: 'bi bi-trash' }))),
      el('div', { className: 'd-flex justify-content-between align-items-center w-100' },
        el('p', { className: 'mb-0 text-secondary small text-truncate flex-grow-1', textContent: meaning }),
        id && el('span', { className: 'badge badge-rank ms-2', textContent: `#${id}` })));
    this.makeActivatable(item, () => this.showDetails(id, nom, row));
    return item;
  }

  async copyText(text, target) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      return console.error('Copy failed', err);
    }
    if (target?.classList.contains('glyph-box')) {
      target.classList.add('border-info');
      setTimeout(() => target.classList.remove('border-info'), 1000);
    }
    this.toast.textContent = `Copied: ${text}`;
    this.toast.style.display = 'block';
    setTimeout(() => { this.toast.style.display = 'none'; }, 2000);
  }

  showDetails(clickedId, mainNom, row) {
    let related = this.data.filter(row => row[1] && row[1].includes(mainNom));
    // IME-Treffer stehen nicht in der CSV
    if (row?.[0] && !related.includes(row)) related.unshift(row);
    const seenEntries = new Set();
    related = related.filter(r => {
      const key = `${r[0].trim().toLowerCase()}|${r[1].trim()}|${r[2].trim()}`;
      if (seenEntries.has(key)) return false;
      seenEntries.add(key);
      return true;
    });

    const sortedRelated = related.sort((a, b) => {
        const aIsExact = (a[1] === mainNom);
        const bIsExact = (b[1] === mainNom);
        if (aIsExact !== bIsExact) return aIsExact ? -1 : 1;
        const aIsCompound = a[0].trim().includes(' ');
        const bIsCompound = b[0].trim().includes(' ');
        if (aIsCompound !== bIsCompound) return aIsCompound ? 1 : -1;
        const aRank = parseInt(a[5]) || Infinity;
        const bRank = parseInt(b[5]) || Infinity;
        return aRank - bRank;
    });

    // Eigener Verlaufseintrag mit ?detail=, Wechsel innerhalb des offenen Popups ersetzt ihn
    if (!history.state || !history.state.modalOpen) {
      history.pushState({ modalOpen: true }, "", this.linkUrl('detail', mainNom));
    } else {
      history.replaceState(history.state, "", this.linkUrl('detail', mainNom));
    }

    this.currentNom = mainNom;
    this.updateBookmarkUi();
    const mainEntry = sortedRelated.find(r => r[1] === mainNom && !r[0].trim().includes(' '));
    const codes = [...mainNom].map(c => c.codePointAt(0).toString(16).toUpperCase());
    // Bilder gibt es nur für Einzelzeichen; der Codepunkt kommt direkt vom Zeichen, nicht aus der CSV
    const hex = codes.length === 1 ? codes[0] : '';
    const strokes = mainEntry ? mainEntry[4] : (related.find(r => r[4])?.[4] || '');
    const rank = clickedId || (mainEntry ? mainEntry[5] : null);

    const exactMatches = sortedRelated.filter(r => r[1] === mainNom);
    const uniqueReadings = [...new Set(exactMatches.map(r => r[0]))];
    const qattParts = uniqueReadings.map(read => this.qattCodes(read)).filter(part => part.length);

    // Großes Bild: Animation, dann zwei SVG-Varianten, sonst das Zeichen als Schrift
    const glyph = this.image(
      hex ? ['animations/anim-' + hex + '.gif', 'glyph-composer/new/' + hex + '.svg', 'glyph-composer/svg/' + hex + '.svg'].map(path => `https://chunom.org/media/${path}`) : [],
      { style: 'height:150px;width:150px' },
      () => el('div', { className: 'text-center' },
        el('div', { className: 'display-1 font-serif text-nowrap', textContent: mainNom }),
        hex && el('div', { className: 'small text-secondary font-monospace', textContent: `U+${hex}` })),
      img => Object.assign(img.style, { visibility: 'hidden', marginTop: '-40px', height: '200px' }));
    glyph.addEventListener('load', () => { glyph.style.visibility = 'visible'; });

    this.modalBody.replaceChildren(
      el('div', { className: 'd-flex align-items-start gap-4 mb-4 p-2' },
        el('div', { className: 'd-flex flex-column align-items-center' },
          el('div', { className: 'd-flex align-items-center justify-content-center rounded border glyph-box px-2', title: 'Click to copy glyph', 'data-copy': mainNom }, glyph)),
        el('div', { className: 'flex-grow-1' },
          // Kopfzeile nur Quốc Ngữ, QATT steht darunter
          el('div', { className: 'd-flex flex-column w-100' }, uniqueReadings.length
            ? uniqueReadings.map(read => el('span', { className: 'fs-2 fw-bold lh-sm', lang: 'vi', textContent: read }))
            : el('span', { className: 'text-secondary fst-italic', textContent: 'Part of compound words' })),
          el('div', { className: 'd-flex flex-column gap-1 mt-3 small text-secondary' },
            uniqueReadings.length > 0 && el('div', {}, 'Quốc Ngữ: ', el('span', { lang: 'vi', textContent: uniqueReadings.join('; ') })),
            qattParts.length > 0 && el('div', {}, 'Quốc Âm Tân Tự: ', qattParts.map((part, i) => [i ? ' / ' : '', part])),
            el('div', {},
              el('span', { className: 'clickable-meta border-bottom', title: 'Click to copy hex code', 'data-copy': codes.join(' '), textContent: `Unicode: ${codes.map(c => `U+${c}`).join(' ')}` }),
              ' - ',
              el('span', { className: 'clickable-meta border-bottom font-serif', title: 'Click to copy', 'data-copy': mainNom, textContent: mainNom })),
            strokes && el('div', { textContent: `Strokes: ${strokes}` }),
            rank && el('div', {}, 'Rank: ', el('span', { className: 'badge badge-rank', textContent: `#${rank}` }))))),
      el('div', { className: 'list-group list-group-flush border-top' }, sortedRelated.map(r => {
        const item = el('div', { className: `list-group-item ${r[1] !== mainNom ? 'list-group-item-action' : ''} py-3 px-0` },
          el('div', { className: 'd-flex align-items-center justify-content-between mb-1' },
            el('div', { className: 'd-flex align-items-center flex-wrap' },
              el('span', { className: 'fs-3 me-2' }, this.nomChars(r[1])),
              el('span', { className: 'text-secondary fw-bold fs-5 qn-text', lang: 'vi', textContent: r[0] })),
            el('div', { className: 'text-end d-flex align-items-center gap-2 flex-wrap justify-content-end' }, this.qattCodes(r[0]))),
          el('div', { className: 'd-flex justify-content-between align-items-center w-100' },
            el('div', { className: 'text-secondary small text-truncate flex-grow-1', textContent: r[2] || 'No description' }),
            r[5] && el('span', { className: 'badge badge-rank ms-2', textContent: `#${r[5]}` })));
        // Zeilen anderer Einträge (Komposita) öffnen deren Details
        if (r[1] !== mainNom) this.makeActivatable(item, () => this.showDetails(r[5], r[1], r));
        return item;
      })));
    // Wechsel innerhalb des offenen Popups: nach oben und Fokus zurück ins Popup
    const modalEl = this.modalBody.closest('.modal');
    if (modalEl.classList.contains('show')) {
      modalEl.scrollTop = 0;
      modalEl.focus();
    }
    this.modal.show();
  }
}

let parser, dict;

window.addEventListener("load", () => {
  try {
    parser = new VietnameseParser();
    new Qatt().observe("qatt-code");
    dict = new ChunomDict('https://qatt.org/chunom/dict.csv', 'search', 'results', 'dict-status');
  } catch (e) {
    console.error("Initialization error", e);
  }
});
  </script>
