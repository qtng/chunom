<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chunom.org</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
  <link rel="stylesheet" href="https://chunom.org/media/css/fonts/all.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://qatt.org/chunom/js/ime.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://qatt.org/qatt/js/navigation.js"></script>
  <script src="https://qatt.org/qatt/js/qatt.js"></script>
  <script src="https://qatt.org/qatt/js/parser.js"></script>
  <style>
    svg {
      stroke: currentColor;
      stroke-width: 5.75px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: transparent;
      vertical-align: baseline;
      display: inline-block;
      height: 2em;
      position: relative;
      top: -.25em;
    }
    code {
      display: inline-block;
      vertical-align: baseline;
      font-family: inherit;
      font-size: 1.5em;
      color: inherit;
    }
    .glyph-box {
      min-width: 120px;
      height: 160px;
      flex-shrink: 0;
    }
    .font-serif {
      font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', serif;
    }
    .font-monospace {
      font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', monospace;
    }
    .lh-sm {
      line-height: 1.1;
    }
    .badge-rank {
      font-weight: 400;
      border: 1px solid rgba(108, 117, 125, 0.5);
      color: #6c757d;
      font-size: 0.65rem;
      background: transparent;
    }
    #copy-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 9999;
      display: none;
      border: 1px solid #444;
    }
    .tile {
      transition: transform 0.15s, border-color 0.15s;
    }
    .tile:hover {
      transform: translateY(-2px);
      border-color: rgba(var(--bs-primary-rgb), 0.6) !important;
    }
    /* Einzeln anklickbare Zeichen: box-shadow statt padding, damit nichts verrutscht */
    .nom-char {
      cursor: pointer;
    }
    .nom-char, .nom-char img {
      border-radius: .25rem;
      transition: background-color .15s, box-shadow .15s;
    }
    :is(#results, #modalBody) .nom-char:hover img,
    :is(#results, #modalBody) .nom-char:not(:has(img)):hover {
      background-color: var(--bs-info-bg-subtle);
      box-shadow: 0 0 0 .2rem var(--bs-info-bg-subtle);
    }
    .clickable-meta {
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .clickable-meta:hover {
      opacity: 1 !important;
      text-decoration: underline;
    }
    #detailModal qatt-code {
      cursor: pointer;
      transition: filter 0.2s;
    }
    #detailModal qatt-code:hover {
      filter: brightness(1.3);
    }
    qatt-code {
      cursor: default;
      vertical-align: sub;
    }

    /* Logik zum Ausblenden von Quốc Ngữ */
    body.hide-qn .qn-text {
      display: none !important;
    }

    /* Styling für die Echtzeit-Suchvorschau */
    #search-preview {
      display: none;
      align-items: center; 
      justify-content: flex-start; 
      border-left: none;
      min-width: 0;
      white-space: nowrap;
      padding-top: 0;
      padding-bottom: 0;
    }
    #search-preview:not(:empty) {
      display: flex;
      min-width: 40px;
      max-width: 30vw;
      overflow-x: auto;
    }
    #search-preview svg {
      height: 1.4em;
    }
    #search:focus {
      box-shadow: none;
      outline: none;
      border-color: #ddd;
    }
  </style>
</head>
<body>
  <div id="copy-toast">Copied</div>

  <div class="container mt-4">


    <!--<div class="alert alert-primary">
      <a class="stretched-link" href="/qatt/challenge/index.html"></a>
      <div class="d-flex flex-wrap justify-content-between align-items-start">
        <div>
          <h4 class="fw-light">
            Thử thách <b>Thư Pháp</b>
          </h4>
        </div>
        <div>
          Hạn nộp bài:
          25.<script>document.write(`0${new Date().getMonth() + 1}`.slice(-2))</script>.<script>document.write(1900+new Date().getYear())</script>
        </div>
      </div>
    </div>-->

    <div class="mt-4 alert alert-secondary">
      <div class="mb-3 d-flex justify-content-between align-items-center">
        <!-- Toggle für Quốc Ngữ ausblenden -->
        <div class="d-inline-flex">
          <div class="form-check form-switch small mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="toggle-qn">
            <label class="form-check-label text-secondary" for="toggle-qn">Hiện Quốc Ngữ</label>
          </div>
          <div class="ms-3 form-check form-switch small mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="toggle-telex">
            <label class="form-check-label text-secondary" for="toggle-telex">Telex</label>
          </div>
        </div>
        <button id="bookmarks-btn" type="button" class="btn btn-sm btn-link" disabled>My Bookmarks</button>
      </div>
      <div class="input-group">
        <span class="input-group-text">Tìm</span>
        <input type="search" id="search" class="form-control" placeholder="Quốc Ngữ hoặc Chữ Nôm..." disabled>
        <div id="search-preview" class="input-group-text bg-warning border"></div>
        <div id="dict-status" class="input-group-text">
          <div class="spinner-border spinner-border-sm text-info" role="status"></div>
        </div>
      </div>
    </div>

    <div id="discovery" class="mt-4">
      <div class="mb-5">
        <div class="alert alert-light shadow-sm py-1 border-0 text-uppercase fw-bold">Top 85 Frequent Words</div>
        <div id="list-top-85" class="row row-cols-4 row-cols-sm-5 row-cols-md-8 row-cols-lg-10 g-2"></div>
      </div>
      <div class="mb-5">
        <div class="alert alert-light shadow-sm py-1 border-0 text-uppercase fw-bold">Next Frequent Words (up to Rank 500)</div>
        <div id="list-next-350" class="row row-cols-4 row-cols-sm-5 row-cols-md-8 row-cols-lg-10 g-2"></div>
      </div>
    </div>

    <div id="bookmarks-title" class="d-none mt-4 alert alert-light shadow-sm py-1 border-0 text-uppercase fw-bold">My Bookmarks</div>
    <div id="results" class="list-group w-100"></div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Chi tiết</h5>
          <div class="d-flex align-items-center">
            <button type="button" id="bookmark-toggle" class="btn p-0 border-0 text-danger" aria-label="Bookmark"><i class="bi bi-heart"></i></button>
            <button type="button" class="ms-4 btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script>
class ChunomDict {
  constructor(apiUrl, searchInputId, resultsContainerId, statusId) {
    this.apiUrl = apiUrl;
    this.searchInput = document.getElementById(searchInputId);
    this.searchPreview = document.getElementById('search-preview');
    this.resultsContainer = document.getElementById(resultsContainerId);
    this.discoveryContainer = document.getElementById('discovery');
    this.statusContainer = document.getElementById(statusId);
    this.toast = document.getElementById('copy-toast');
    this.qnToggle = document.getElementById('toggle-qn');
    this.telexToggle = document.getElementById('toggle-telex');
    
    const modalEl = document.getElementById('detailModal');
    if (typeof bootstrap !== 'undefined') {
      this.modal = new bootstrap.Modal(modalEl);
    }
    this.modalBody = document.getElementById('modalBody');
    this.modalTitle = document.getElementById('modalTitle');
    
    this.cacheKey = 'chunom_dict_data';
    this.cacheTimeKey = 'chunom_dict_timestamp';
    this.qnHiddenKey = 'chunom_qn_hidden';
    this.telexKey = 'chunom_telex';
    this.expirationMs = 24 * 60 * 60 * 1000; 
    this.data = [];
    
    this.initSettings();
    this.initBookmarks();
    this.initHistoryHandler(modalEl);
    this.init();
    this.initGlobalClickHandlers();
  }

  initSettings() {
    const qnHidden = localStorage.getItem(this.qnHiddenKey) === 'true';
    this.qnToggle.checked = !qnHidden;
    if (qnHidden) document.body.classList.add('hide-qn');

    this.qnToggle.addEventListener('change', (e) => {
      const hidden = e.target.checked;
      localStorage.setItem(this.qnHiddenKey,! hidden);
      document.body.classList.toggle('hide-qn', !hidden);
    });

    // Telex-IME von chunom.org: auf Touch-Geräten standardmäßig aus
    const telex = localStorage.getItem(this.telexKey);
    this.telexToggle.checked = telex ? telex === 'true' : !matchMedia('(pointer: coarse)').matches;
    this.setTelex(this.telexToggle.checked);
    this.telexToggle.addEventListener('change', (e) => {
      localStorage.setItem(this.telexKey, e.target.checked);
      this.setTelex(e.target.checked);
    });
  }

  setTelex(on) {
    if (!window.jQuery?.fn.vietime) return;
    const $search = $(this.searchInput);
    // Instanz immer anlegen: sie lädt die Wörterbücher, die die Suche auch ohne Telex nutzt
    if (!$search.data('ime')) {
      $search.vietime({
        defer: true,
        candidate_list: true,
        font_list: ['nom na tong supplement'],
        candidate_selected: (glyph) => { setTimeout(() => this.onType()); return glyph; },
        dictionaries_loaded: () => { if (!this.showingBookmarks) this.search(this.searchInput.value); }
      });
    }
    $search.vietime('update', on ? { method: true, candidate_list: true } : { method: 'off', candidate_list: false });
  }

  // Das IME ändert den Wert ohne input-Event, daher zusätzlich auf keyup reagieren
  onType() {
    if (this.searchInput.value === this.lastTerm) return;
    this.lastTerm = this.searchInput.value;
    this.search(this.lastTerm);
  }

  initBookmarks() {
    this.bookmarksKey = 'chunom_bookmarks';
    this.bookmarks = JSON.parse(localStorage.getItem(this.bookmarksKey) || '[]');
    this.bookmarkToggle = document.getElementById('bookmark-toggle');
    this.bookmarksBtn = document.getElementById('bookmarks-btn');
    this.bookmarksTitle = document.getElementById('bookmarks-title');
    this.bookmarkToggle.addEventListener('click', () => {
      this.toggleBookmark(this.currentNom);
      this.bookmarkToggle.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.5)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'ease-out' });
    });
    this.bookmarksBtn.addEventListener('click', () => this.showingBookmarks ? this.search(this.searchInput.value) : this.showBookmarks());
  }

  toggleBookmark(nom) {
    const i = this.bookmarks.indexOf(nom);
    if (i < 0) this.bookmarks.unshift(nom); else this.bookmarks.splice(i, 1);
    localStorage.setItem(this.bookmarksKey, JSON.stringify(this.bookmarks));
    this.updateBookmarkUi();
    if (this.showingBookmarks) this.showBookmarks();
  }

  updateBookmarkUi() {
    this.bookmarkToggle.innerHTML = `<i class="bi ${this.bookmarks.includes(this.currentNom) ? 'bi-heart-fill' : 'bi-heart'}"></i>`;
    this.bookmarksBtn.disabled = !this.bookmarks.length;
  }

  showBookmarks() {
    if (!this.bookmarks.length) return this.search(this.searchInput.value);
    this.resultsContainer.innerHTML = '';
    this.discoveryContainer.classList.add('d-none');
    this.bookmarksTitle.classList.remove('d-none');
    this.showingBookmarks = true;
    this.bookmarksBtn.classList.add('active');
    const fragment = document.createDocumentFragment();
    for (const nom of this.bookmarks) {
      const rows = this.data.filter(r => r[1] === nom);
      // Zeichen, die nur in Komposita vorkommen, haben keine eigene Zeile
      (rows.length ? rows : [['', nom, '', '']]).forEach(r => fragment.appendChild(this.createResultItem(r, true)));
    }
    this.resultsContainer.appendChild(fragment);
  }

  initHistoryHandler(modalEl) {
    window.addEventListener('popstate', () => {
      if (this.modal) this.modal.hide();
    });
    // Nach dem Schließen zurück zum auslösenden Element, damit man per Tastatur weitermachen kann
    modalEl.addEventListener('show.bs.modal', () => { this.returnFocus = document.activeElement; });
    modalEl.addEventListener('hidden.bs.modal', () => {
      if (history.state && history.state.modalOpen) {
        history.back();
      }
      this.returnFocus?.focus();
    });
  }

  initGlobalClickHandlers() {
    // Tippen irgendwo auf der Seite springt ins Suchfeld – nur sichtbare Zeichen, keine Tastenkürzel
    document.addEventListener('keydown', (e) => {
      if (e.key.length !== 1 || e.key === ' ' || e.ctrlKey || e.metaKey || e.isComposing) return;
      if (e.target === this.searchInput || document.body.classList.contains('modal-open')) return;
      this.searchInput.focus();
    });
    document.addEventListener('click', (e) => {
      const tt = e.target.closest('qatt-code');
      if (tt && tt.title && e.target.closest('#detailModal')) {
        e.stopPropagation();
        const query = tt.title.toLowerCase();
        this.searchInput.value = query;
        this.search(query);
        if (this.modal) this.modal.hide();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }, true); // Capture: QATT-Klick hat Vorrang vor der anklickbaren Zeile im Popup
  }

  // Per Tab erreichbar und per Klick, Enter oder Leertaste auszulösen
  makeActivatable(el, action) {
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.addEventListener('click', action);
    el.addEventListener('keydown', (e) => {
      if (e.target === el && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        action();
      }
    });
  }

  async init() {
    let cachedData = localStorage.getItem(this.cacheKey);
    const cachedTime = localStorage.getItem(this.cacheTimeKey);
    const now = Date.now();

    if (cachedData && cachedTime && (now - cachedTime < this.expirationMs)) {
      try {
        this.data = JSON.parse(cachedData);
        this.finishLoading();
        return;
      } catch (e) {
        console.error("Cache parse error", e);
      }
    }

    try {
      const response = await fetch(this.apiUrl);
      if (!response.ok) throw new Error("Network error");
      const text = await response.text();
      this.data = this.parseCSV(text);
      localStorage.setItem(this.cacheKey, JSON.stringify(this.data));
      localStorage.setItem(this.cacheTimeKey, now.toString());
      this.finishLoading();
    } catch (err) {
      console.error("Fetch error", err);
      this.showError("Error loading data.");
    }
  }

  parseCSV(text) {
    const rows = [];
    const lines = text.split(/\r?\n/);
    for (let line of lines) {
      if (!line.trim()) continue;
      const row = [];
      let cell = '', inQuotes = false;
      for (let char of line) {
        if (char === '"') inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) {
          row.push(cell.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
          cell = '';
        } else cell += char;
      }
      row.push(cell.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
      if (row.length >= 2) rows.push(row);
    }
    return rows;
  }

  finishLoading() {
    this.statusContainer.classList.add('d-none');
    this.searchInput.removeAttribute('disabled');
    this.searchInput.placeholder = "Type Quốc Ngữ or Chữ Nôm...";
    this.searchInput.addEventListener('input', () => this.onType());
    this.searchInput.addEventListener('keyup', () => this.onType());
    this.renderDiscoveryLists();
    this.updateBookmarkUi();
  }

  getQattHtml(quocNgu, fontSize = 'inherit') {
    if (!quocNgu || !parser) return '';
    return quocNgu.split(/\s+/).map(word => {
      const parsed = parser.parse(word);
      const cleanWord = word.replace(/"/g, '&quot;');
      return parsed ? `<qatt-code style="font-size: ${fontSize};" title="${cleanWord}">${parsed.code}</qatt-code>` : '';
    }).join(' ');
  }

  renderDiscoveryLists() {
    const list85 = document.getElementById('list-top-85');
    const listNext = document.getElementById('list-next-350');
    if (!list85 || !listNext) return;

    const uniqueRanksMap = new Map();
    this.data.forEach(r => {
      const rank = parseInt(r[5]);
      if (!isNaN(rank)) {
        if (!uniqueRanksMap.has(rank) || r[3] === '1') {
          uniqueRanksMap.set(rank, r);
        }
      }
    });

    const allUnique = Array.from(uniqueRanksMap.values())
      .sort((a, b) => parseInt(a[5]) - parseInt(b[5]));

    const renderGrid = (items, container) => {
      const frag = document.createDocumentFragment();
      items.forEach(r => {
        const col = document.createElement('div');
        col.className = 'col';
        col.innerHTML = `
          <div class="pt-4 p-2 rounded text-center h-100 d-flex flex-column justify-content-center border border-secondary border-opacity-25 position-relative shadow-sm tile" style="cursor: pointer">
            <span class="position-absolute top-0 start-0 m-1 badge badge-rank" style="opacity: 0.8">#${r[5]}</span>
            <div class="h3 font-serif mb-0">${this.wrapNomChars(r[1])}</div>
            <div class="d-flex align-items-center justify-content-center gap-1 mt-1 overflow-hidden flex-wrap">
              ${this.getQattHtml(r[0], '0.7rem')}
            </div>
            <div class="text-secondary small opacity-75 text-truncate w-100 qn-text">${r[0]}</div>
          </div>
        `;
        col.onclick = () => this.showDetails(r[5], r[1]);
        frag.appendChild(col);
      });
      container.innerHTML = "";
      container.appendChild(frag);
    };

    const top85Items = allUnique.filter(r => parseInt(r[5]) <= 85);
    const nextItems = allUnique.filter(r => parseInt(r[5]) > 85 && parseInt(r[5]) <= 500);

    renderGrid(top85Items, list85);
    renderGrid(nextItems, listNext);
  }

  showError(msg) {
    this.statusContainer.innerHTML = `<span class="text-danger small">${msg}</span>`;
  }

  search(term) {
    const query = term.trim().toLowerCase();
    this.showingBookmarks = false;
    this.bookmarksBtn.classList.remove('active');
    this.bookmarksTitle.classList.add('d-none');
    
    if (this.searchPreview) {
      if (query && !/[\u4e00-\u9fff]/.test(query)) {
        const html = this.getQattHtml(query, '1.4em');
        this.searchPreview.innerHTML = html;
        this.searchInput.style.borderRight = html ? 'none' : '';
      } else {
        this.searchPreview.innerHTML = '';
        this.searchInput.style.borderRight = '';
      }
    }

    this.resultsContainer.innerHTML = '';
    
    if (!query) {
      this.discoveryContainer.classList.remove('d-none');
      return;
    }

    this.discoveryContainer.classList.add('d-none');

    const rows = this.data.filter(row => row[0].toLowerCase().includes(query) || row[1].includes(query));
    // Treffer aus den IME-Wörterbüchern; neu ist ein Treffer nur, wenn seine Zeichen noch nicht gelistet sind
    if (window.jQuery?.fn.vietime?.lookup && !/\p{Script=Han}/u.test(query)) {
      const shown = new Set(rows.map(row => row[1]));
      for (const { glyph, reading, definition } of $.fn.vietime.lookup(query)) {
        if (shown.has(glyph)) continue;
        const hex = [...glyph].length === 1 ? glyph.codePointAt(0).toString(16).toUpperCase() : '';
        rows.push([reading, glyph, definition, '', '', '', hex]);
      }
    }
    // Exakte Aussprache zuerst, dann mit Beschreibung, dann der Rest – jeweils nach Rang (ohne Rang zuletzt), dann kürzere Aussprache
    const group = row => row[0].trim().toLowerCase() === query || row[1] === query ? 0 : row[2] ? 1 : 2;
    const rank = row => parseInt(row[5]) || Infinity;
    rows.sort((a, b) => group(a) - group(b) || rank(a) - rank(b) || a[0].trim().length - b[0].trim().length);

    const fragment = document.createDocumentFragment();
    rows.slice(0, 80).forEach(row => fragment.appendChild(this.createResultItem(row)));
    this.resultsContainer.appendChild(fragment);
  }

  createResultItem(row, removable = false) {
    const [quocNgu, nom, meaning, id] = [row[0], row[1], row[2], row[5]];
    const div = document.createElement('div');
    div.className = 'list-group-item list-group-item-action py-3';
    div.innerHTML = `
      <div class="d-flex w-100 align-items-center mb-1">
        <div class="me-auto d-flex align-items-center">
          <span class="fs-2 me-2">${this.wrapNomChars(nom)}</span>
          <span class="text-secondary fw-bold qn-text">${quocNgu}</span>
        </div>
        <div class="text-end d-flex align-items-center gap-2 flex-wrap justify-content-end">
          ${this.getQattHtml(quocNgu)}
        </div>
        ${removable ? `<button type="button" class="btn p-0 border-0 text-secondary ms-3 remove-bookmark" title="Remove" aria-label="Remove bookmark"><i class="bi bi-trash"></i></button>` : ''}
      </div>
      <div class="d-flex justify-content-between align-items-center w-100">
        <p class="mb-0 text-secondary small text-truncate flex-grow-1">${meaning}</p>
        ${id ? `<span class="badge badge-rank ms-2">#${id}</span>` : ''}
      </div>
    `;
    this.makeActivatable(div, () => this.showDetails(id, nom, row));
    div.querySelector('.remove-bookmark')?.addEventListener('click', (e) => {
      e.stopPropagation();
      this.toggleBookmark(nom);
    });
    return div;
  }

  async copyText(text, el) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    try {
      document.execCommand('copy');
      if (el && el.classList.contains('glyph-box')) {
        el.classList.add('border-info');
        setTimeout(() => el.classList.remove('border-info'), 1000);
      }
      this.toast.innerText = `Copied: ${text}`;
      this.toast.style.display = 'block';
      setTimeout(() => { this.toast.style.display = 'none'; }, 2000);
    } catch (err) {
      console.error('Copy failed', err);
    }
    document.body.removeChild(textArea);
  }

  wrapNomChars(text) {
    if (!text) return '';
    return text.replace(/[\u4e00-\u9fff\u3400-\u4dbf\u{20000}-\u{323af}]/gu, (match) => {
      const hex = match.codePointAt(0).toString(16).toUpperCase();
      return `<span class="font-serif nom-char" onclick="event.stopPropagation(); dict.showDetails(null, '${match}')"><img src="https://chunom.org/media/generated/${hex}-32.png" alt="${match}" width="32" height="32" style="vertical-align: middle" onerror="this.replaceWith(this.alt)"></span>`;
    });
  }

  showDetails(clickedId, mainNom, row) {
    let related = this.data.filter(row => row[1] && row[1].includes(mainNom));
    // IME-Treffer stehen nicht in der CSV
    if (row?.[0] && !related.includes(row)) related.unshift(row);
    const seenEntries = new Set();
    related = related.filter(r => {
      const key = `${r[0].trim().toLowerCase()}|${r[1].trim()}|${r[2].trim()}`;
      if (seenEntries.has(key)) return false;
      seenEntries.add(key);
      return true;
    });

    const sortedRelated = related.sort((a, b) => {
        const aIsExact = (a[1] === mainNom);
        const bIsExact = (b[1] === mainNom);
        if (aIsExact !== bIsExact) return aIsExact ? -1 : 1;
        const aIsCompound = a[0].trim().includes(' ');
        const bIsCompound = b[0].trim().includes(' ');
        if (aIsCompound !== bIsCompound) return aIsCompound ? 1 : -1;
        const aRank = parseInt(a[5]) || Infinity;
        const bRank = parseInt(b[5]) || Infinity;
        return aRank - bRank;
    });

    if (!history.state || !history.state.modalOpen) {
      history.pushState({ modalOpen: true }, "");
    }

    this.modalTitle.innerText = 'Details';
    this.currentNom = mainNom;
    this.updateBookmarkUi();
    const mainEntry = sortedRelated.find(r => r[1] === mainNom && !r[0].trim().includes(' '));
    const hex = mainEntry ? mainEntry[6] : (related.find(r => r[6])?.[6] || '');
    const codes = [...mainNom].map(c => c.codePointAt(0).toString(16).toUpperCase());
    const strokes = mainEntry ? mainEntry[4] : (related.find(r => r[4])?.[4] || '');
    const rank = clickedId || (mainEntry ? mainEntry[5] : null);

    const exactMatches = sortedRelated.filter(r => r[1] === mainNom);
    const uniqueReadings = [...new Set(exactMatches.map(r => r[0]))];

    // Kopfzeile nur Quốc Ngữ, QATT steht darunter
    const readingsHtml = uniqueReadings.map(read => `<span class="fs-2 fw-bold lh-sm">${read}</span>`).join('');

    const quocNgu = uniqueReadings.join('; ');
    const qatt = uniqueReadings.map(read => {
      return this.getQattHtml(read);
    }).join(' / ');

    this.modalBody.innerHTML = `
      <div class="d-flex align-items-start gap-4 mb-4 p-2">
        <div class="d-flex flex-column align-items-center">
          <div class="d-flex align-items-center justify-content-center rounded border glyph-box px-2" 
               onclick="dict.copyText('${mainNom}', this)" title="Click to copy glyph">
            <!--<span class="display-1 font-serif text-nowrap">${mainNom}</span>-->
            <img src="https://chunom.org/media/animations/anim-${hex}.gif"
              data-fallbacks="https://chunom.org/media/glyph-composer/new/${hex}.svg https://chunom.org/media/glyph-composer/svg/${hex}.svg"
              onload="this.style.visibility='visible'"
              onerror="Object.assign(this.style,{visibility:'hidden',marginTop:'-40px',height:'200px'});var fb=this.dataset.fallbacks.split(' ').filter(Boolean); if(fb.length){this.dataset.fallbacks=fb.slice(1).join(' ');this.src=fb[0]} else {this.onerror=null;this.nextElementSibling.classList.remove('d-none');this.remove()}"
              style="height:150px;width:150px"/>
            <div class="d-none text-center">
              <div class="display-1 font-serif text-nowrap">${hex ? `&#x${hex};` : mainNom}</div>
              ${hex ? `<div class="small text-secondary font-monospace">U+${hex}</div>` : ''}
            </div>
          </div>
        </div>
        <div class="flex-grow-1">
          <div class="d-flex flex-column w-100">${readingsHtml || '<span class="text-secondary fst-italic">Part of compound words</span>'}</div>
          <div class="d-flex flex-column gap-1 mt-3 small text-secondary">
            ${quocNgu ? `<div>Quốc Ngữ: ${quocNgu}</div>` : ''}
            ${qatt ? `<div>Quốc Âm Tân Tự: ${qatt}</div>` : ''}
             <div><span class="clickable-meta border-bottom" onclick="dict.copyText('${codes.join(' ')}', this)" title="Click to copy Hex code">Unicode: ${codes.map(c => `U+${c}`).join(' ')}</span> - <span class="clickable-meta border-bottom font-serif" onclick="dict.copyText('${mainNom}', this)" title="Click to copy">${mainNom}</span></div>
             ${strokes ? `<div>Số nét: ${strokes}</div>` : ''}
             ${rank ? `<div>Hạng: <span class="badge badge-rank">#${rank}</span></div>` : ''}
          </div>
        </div>
      </div>
      <div class="list-group list-group-flush border-top">
        ${sortedRelated.map(r => {
          return `
          <div class="list-group-item ${r[1] !== mainNom ? 'list-group-item-action' : ''} py-3 px-0">
            <div class="d-flex align-items-center justify-content-between mb-1">
              <div class="d-flex align-items-center flex-wrap">
                <span class="fs-3 me-2">${this.wrapNomChars(r[1])}</span>
                <span class="text-secondary fw-bold fs-5 qn-text">${r[0]}</span> 
              </div>
              <div class="text-end d-flex align-items-center gap-2 flex-wrap justify-content-end">
                ${this.getQattHtml(r[0])}
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center w-100">
              <div class="text-secondary small text-truncate flex-grow-1">${r[2] || 'No description'}</div>
              ${r[5] ? `<span class="badge badge-rank ms-2">#${r[5]}</span>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>`;
    // Zeilen anderer Einträge (Komposita) öffnen deren Details
    this.modalBody.querySelectorAll('.list-group-item').forEach((el, i) => {
      const r = sortedRelated[i];
      if (r[1] !== mainNom) this.makeActivatable(el, () => this.showDetails(r[5], r[1], r));
    });
    // Wechsel innerhalb des offenen Popups: nach oben und Fokus zurück ins Popup
    const modalEl = this.modalBody.closest('.modal');
    if (modalEl.classList.contains('show')) {
      modalEl.scrollTop = 0;
      modalEl.focus();
    }
    this.modal.show();
  }
}

let parser, dict;

window.addEventListener("load", () => {
  try {
    parser = new VietnameseParser();
    new Qatt().observe("qatt-code");
    dict = new ChunomDict('https://qatt.org/chunom/dict.csv', 'search', 'results', 'dict-status');
  } catch (e) {
    console.error("Initialization error", e);
  }
});
  </script>
</html>
