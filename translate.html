<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quốc Ngữ → Chữ Nôm</title>
  <meta name="description" content="Transcribe Vietnamese (Quốc Ngữ) into Chữ Nôm: the characters are chosen from the dictionaries in the context of the sentence.">
  <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/chunom-assets/fonts/fonts.css">
  <script src="https://qatt.org/js/navigation.js"></script>
  <script defer src="https://qatt.org/vendor/supabase/supabase.min.js"></script>
  <script defer src="https://qatt.org/js/supabase.js"></script>
  <script defer src="https://qatt.org/js/login.js"></script>
  <script defer src="/chunom/js/detail.js"></script>
  <style>
    :root { --ink: #2b2118; --accent: #a8362a; --line: #e4d9c0; --muted: #7b6c58; }
    body { color: var(--ink); background: linear-gradient(180deg, #f7efdc 0, #fffdf8 18rem) no-repeat, #fffdf8; min-height: 100vh; }
    main { max-width: 44rem; margin: 0 auto; padding: 1.2rem 1rem 2rem; }
    .page-head { text-align: center; padding: .4rem 0 0; margin-bottom: 1rem; }
    .page-head .han { color: var(--accent); font-size: 1.3rem; }
    .page-head h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(1.9rem, 6vw, 2.6rem); margin: .1rem 0 .2rem; }
    .page-head p { color: var(--muted); margin: 0 auto; max-width: 40rem; }
    /* loading animation: the four characters of "Việt Nam chữ Nôm" rise one after the other like brush strokes */
    .loading { display: flex; justify-content: center; gap: 1rem; padding: 1.1rem 0 .3rem; }
    .loading .ch { font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', serif; font-size: 2.2rem; line-height: 1; color: var(--accent); opacity: .15; animation: ink 1.6s ease-in-out infinite; }
    .loading .ch:nth-child(2) { animation-delay: .2s; } .loading .ch:nth-child(3) { animation-delay: .4s; } .loading .ch:nth-child(4) { animation-delay: .6s; }
    @keyframes ink { 0%, 100% { opacity: .15; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-.35rem); } 70% { opacity: .4; transform: translateY(0); } }
    .loading[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { .loading .ch { animation: none; opacity: .7; } }
    .box { background: #fffdf8; border: 1px solid var(--line); border-radius: .7rem; padding: .8rem; box-shadow: 0 .3rem 1rem rgba(60, 40, 20, .12); }
    textarea { width: 100%; min-height: 11.1rem; resize: vertical; border: 1px solid #cdbf9f; border-radius: .5rem; padding: .5rem .7rem; font-size: 1.1rem; background: #fff; }
    textarea:focus { outline: 2px solid rgba(168, 54, 42, .35); }
    .btn-go { --bs-btn-bg: var(--accent); --bs-btn-border-color: var(--accent); --bs-btn-color: #fff; --bs-btn-hover-bg: #8c2c22; --bs-btn-hover-border-color: #8c2c22; --bs-btn-hover-color: #fff; --bs-btn-active-bg: #8c2c22; --bs-btn-active-border-color: #8c2c22; --bs-btn-active-color: #fff; --bs-btn-disabled-bg: var(--accent); --bs-btn-disabled-border-color: var(--accent); --bs-btn-disabled-color: #fff; background: var(--accent); border-color: var(--accent); color: #fff; border-radius: 2rem; padding: .4rem 1.4rem; }
    .btn-go:disabled { opacity: .55; }
    .btn-quiet { border: 1px solid #cdbf9f; background: #fff; color: #5b4d3d; border-radius: 2rem; padding: .25rem .9rem; font-size: .85rem; }
    .count { font-size: .8rem; color: var(--muted); }
    #status { min-height: 1.6rem; margin-top: .6rem; color: var(--accent); font-weight: 600; }
    #status.error { color: #842029; }
    #result { margin-top: 1rem; }
    .flag { color: #842029; }
    .font-serif { font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', serif; }
    /* the result as text in the Nôm font (selectable, copyable), every character with its Quốc Ngữ as ruby text above it */
    .nom { font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', serif; font-size: 2rem; line-height: 1.5; }
    .nom ruby { ruby-position: over; }
    .nom rt { font: .75rem/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--muted); user-select: none; }   /* not copied with the text */
    .nom.no-rt rt { display: none; }
    .nom .ch { cursor: pointer; border-radius: .25rem; transition: background-color .15s; }
    .nom .ch:hover { background-color: #dff1f8; }
    .nom .txt { font-size: 1.3rem; }
    /* characters as images (as on the dictionary page), each one opens the popup of the character */
    .nom-char { cursor: pointer; }
    .nom-char, .nom-char img { border-radius: .25rem; transition: background-color .15s, box-shadow .15s; }
    .nom-char:hover img, .nom-char:not(:has(img)):hover { background-color: #dff1f8; box-shadow: 0 0 0 .2rem #dff1f8; }
    /* how sure a word is: green = sure, orange dashed = differs from the dictionary, red = uncertain, dotted yellow = not checked */
    .unit { display: inline-block; white-space: nowrap; margin: 0 .08em; padding-bottom: .05em; border-bottom: .22rem solid transparent; }   /* a word (a compound too) is never split over two lines */
    .unit.sure { border-bottom-color: #3f8a4f; }
    .unit.differs { border-bottom-color: #d9822b; border-bottom-style: dashed; }
    .unit.uncertain { border-bottom-color: #c0392b; }
    .unit.unchecked { border-bottom-color: #c9a227; border-bottom-style: dotted; }
    .state { white-space: nowrap; font-weight: 600; }
    .state.sure { color: #2f6f3e; }
    .state.differs { color: #a35a12; }
    .state.uncertain { color: #842029; }
    .state.unchecked { color: #8a6d0b; }
    .legend { font-size: .8rem; }
    .legend .unit { margin-right: .6em; }
    table.units { font-size: .85rem; }
    table.units th { border-bottom: 1px solid var(--line); }
    table.units td, table.units th { vertical-align: top; }
    table.units tbody td { border-top: 1px solid var(--line); }
    table.units tbody tr:first-child td { border-top: 0; }
    table.units td.chars-cell { white-space: nowrap; }
    .def { color: var(--muted); }
    /* alternative candidates: in the last column under the definition, muted, with a small title over the first one */
    .alts { margin-top: .4rem; color: var(--muted); font-size: .8rem; }
    .alts .alts-title { font-size: .75rem; }
    .alts .alt { display: flex; align-items: center; gap: .5rem; margin-top: .15rem; }
    .alts .alt .alt-chars { white-space: nowrap; flex-shrink: 0; }
    /* characters without an image are shown as font text, as big as the images (32 px in the table, 24 px for alternatives) */
    td.chars-cell .nom-char { font-size: 32px; line-height: 1; }
    .alts .alt-chars .nom-char { font-size: 24px; line-height: 1; }
    .alts .alt img { opacity: .8; }
    .account { font-size: .85rem; color: var(--muted); margin-top: 1.2rem; }
  </style>
</head>
<body>
<main>
  <header class="page-head">
    <div class="han">喃</div>
    <h1 data-vi="Bộ chuyển đổi">Converter</h1>
    <p><span class="d-block" data-vi="Tự động chuyển chữ Quốc Ngữ sang chữ Nôm.">Automatic Quốc Ngữ to Nôm transliteration.</span><span class="d-block" data-vi="Đây là bản dịch máy và có thể không chính xác.">This is a machine translation that might be inaccurate.</span></p>
  </header>

  <div class="box">
    <label for="text" class="form-label fw-semibold">Quốc Ngữ → Chữ Nôm</label>
    <textarea id="text" lang="vi" maxlength="400" spellcheck="false" placeholder="Tôi là người Việt Nam." data-vi-placeholder="Gõ hoặc dán Quốc Ngữ…"></textarea>
    <div class="d-flex justify-content-between mt-1"><span class="count" id="quota" hidden></span><span class="count ms-auto"><span id="count">0</span> / 400</span></div>
    <div class="d-flex justify-content-center align-items-center flex-wrap gap-2 mt-2">
      <select id="lang" class="form-select w-auto" aria-label="Output">
        <option value="">Chữ Nôm</option><option value="en">Chữ Nôm + English</option><option value="de">Chữ Nôm + Deutsch</option><option value="fr">Chữ Nôm + Français</option><option value="es">Chữ Nôm + Español</option><option value="it">Chữ Nôm + Italiano</option><option value="pt">Chữ Nôm + Português</option><option value="ru">Chữ Nôm + Русский</option><option value="zh">Chữ Nôm + 中文</option><option value="ja">Chữ Nôm + 日本語</option><option value="ko">Chữ Nôm + 한국어</option>
      </select>
      <button type="button" class="btn btn-go" id="go" data-vi="Dịch">Translate</button>
    </div>
    <div class="loading" id="loading" role="status" hidden><span class="ch" aria-hidden="true">越</span><span class="ch" aria-hidden="true">南</span><span class="ch" aria-hidden="true">𡨸</span><span class="ch" aria-hidden="true">喃</span><span class="visually-hidden" data-vi="Đang dịch…">Translating…</span></div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <section id="result" hidden>
    <div class="box">
      <div class="d-flex align-items-center flex-wrap gap-3 mb-2">
        <button type="button" class="btn-quiet" id="copy"><i class="bi bi-clipboard"></i> <span data-vi="Sao chép">Copy</span></button>
        <div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" role="switch" id="rt-toggle" checked><label class="form-check-label small" for="rt-toggle" data-vi="Hiện Quốc Ngữ phía trên chữ">Show Quốc Ngữ above the characters</label></div>
      </div>
      <div class="nom" id="nom" lang="vi-Hani"></div>
      <p class="mt-2 mb-0" id="translation" hidden></p>
      <div class="alert alert-warning py-2 px-3 mt-3 mb-0">
        <div class="legend"><span class="unit sure" data-vi="từ danh sách">from the list</span><span class="unit differs" data-vi="mô hình tự chọn">model's own</span><span class="unit uncertain" data-vi="chưa chắc">uncertain</span></div>
        <div class="small mt-1" id="warn" hidden></div>
      </div>
    </div>
    <h2 class="h6 fw-semibold mt-3 mb-0" data-vi="Chi tiết">Details</h2>
    <div class="table-responsive mt-2">
      <table class="table table-sm table-borderless units"><thead><tr><th>#</th><th>Quốc Ngữ</th><th data-vi="Chữ Nôm">Chữ Nôm</th><th data-vi="Trạng thái / Định nghĩa">Status / Definition</th></tr></thead><tbody id="units"></tbody></table>
    </div>
    <div class="count mt-3" id="version"></div>
    <details class="mt-2 small" id="lists-box">
      <summary class="fw-semibold" data-vi="Danh sách gửi cho mô hình">Lists sent to the model</summary>
      <pre class="mt-2 p-2 bg-white border rounded" id="lists" style="white-space: pre-wrap; font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', serif;"></pre>
    </details>
  </section>

  <p class="account" id="account"></p>
</main>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = id => document.getElementById(id);
  const t = (en, vi) => (typeof Lang !== 'undefined' ? Lang.t(en, vi) : en);
  const norm = x => String(x || '').normalize('NFC').toLowerCase().trim();
  const text = $('text'), go = $('go'), status = $('status');
  text.addEventListener('input', () => { $('count').textContent = text.value.length; });

  // the supabase scripts are deferred: wait until they are there
  const ready = async () => {
    for (let i = 0; i < 100 && !(typeof SupabaseService !== 'undefined' && typeof QattLogin !== 'undefined'); i++) await new Promise(r => setTimeout(r, 50));
    const sp = new SupabaseService();
    await sp.init();
    return sp;
  };

  // ---- the dictionaries of the page: dict.csv (readings, characters, meanings, "standard") and the input method of js/ime.js
  const csvReady = fetch('/chunom/dict.csv').then(r => r.text()).then(csv => {
    const map = new Map();
    for (const line of csv.split('\n')) {
      const m = /^"((?:[^"]|"")*)","((?:[^"]|"")*)"(?:,"((?:[^"]|"")*)")?(.*)$/.exec(line);
      if (!m) continue;
      const key = norm(m[1].replace(/""/g, '"'));
      if (!map.has(key)) map.set(key, []);
      map.get(key).push({ han: m[2].replace(/""/g, '"'), gloss: (m[3] || '').replace(/""/g, '"'), standard: /"standard"\s*$/.test(m[4]) });
    }
    return map;
  }).catch(e => { console.warn('dict.csv not loaded', e); return new Map(); });
  const imeReady = typeof ChunomDetail !== 'undefined' ? ChunomDetail.loadIme() : Promise.resolve();
  const sp = await ready();
  QattLogin.status(sp, $('account'));

  // the options for a reading ("có thể"): characters of dict.csv (standard first, with meaning), then the others of the dictionaries of the
  // input method, those with a definition first; at most 15
  const MAX_OPTIONS = 15, MAX_SENT = 15;   // the model gets the characters only (no meanings): its own knowledge decides, the list only limits the choice
  const optionCache = new Map();
  const optionsFor = (key, csv) => {
    if (optionCache.has(key)) return optionCache.get(key);
    const out = new Map();
    for (const e of csv.get(key) || []) out.set(e.han, { c: e.han, m: e.gloss, score: e.standard ? 30 : 20 });
    if (window.VietIme && window.VietIme.lookup) {
      for (const e of window.VietIme.lookup(key.replace(/ /g, ''))) {
        if (norm(e.reading) !== key) continue;
        const prev = out.get(e.glyph);
        if (prev) { if (!prev.m) prev.m = e.definition; }
        else out.set(e.glyph, { c: e.glyph, m: e.definition, score: e.definition ? 10 : 1 });
      }
    }
    const list = [...out.values()].sort((a, b) => b.score - a.score).slice(0, MAX_OPTIONS).map(({ c, m, score }) => ({ c, m, s: score >= 30 ? 1 : 0 }));   // s: the usual character according to dict.csv ("standard")
    optionCache.set(key, list);
    return list;
  };
  // all spans of 1 to 4 syllables that have options
  const buildSpans = (value, csv) => {
    const syl = (value.match(/[\p{L}\p{M}]+/gu) || []).map(norm);
    const spans = [], full = new Map();   // spans: what is sent; full: all options of a span for the alternatives
    for (let at = 0; at < syl.length; at++) {
      for (let len = 1; len <= 4 && at + len <= syl.length; len++) {
        const options = optionsFor(syl.slice(at, at + len).join(' '), csv);
        if (!options.length) continue;
        full.set(at + '+' + len, options);
        spans.push({ at, len, options: options.slice(0, MAX_SENT).map(o => ({ c: o.c, s: o.s })) });
      }
    }
    return { syl, spans, full };
  };

  const say = (msg, error) => { status.textContent = msg; status.className = error ? 'error' : ''; };
  const ERRORS = {
    sign_in: t('Please sign in first.', 'Vui lòng đăng nhập trước.'),
    too_long: t('The text is too long (up to 400 characters).', 'Văn bản quá dài (tối đa 400 ký tự).'),
    limit: t('Daily limit reached. Please try again tomorrow.', 'Đã hết lượt trong ngày. Vui lòng thử lại ngày mai.'),
    busy: t('The service is busy. Please try again in a minute.', 'Dịch vụ đang bận. Vui lòng thử lại sau ít phút.'),
    bad_request: t('The lists were not accepted. Try a shorter text.', 'Danh sách không được chấp nhận. Hãy thử văn bản ngắn hơn.'),
    empty: t('Please type some text.', 'Vui lòng nhập văn bản.'),
  };
  // requests left today: the function reports it with every result; the page keeps it for the day (UTC, like the counter of the server)
  // and shows it approximately. After the error "limit" it is 0; on a new day it is unknown again and not shown.
  const today = () => new Date().toISOString().slice(0, 10);
  const quotaShow = () => {
    let q = null;
    try { q = JSON.parse(localStorage.getItem('translate_left')); } catch { /* no storage */ }
    const box = $('quota');
    if (!q || q.day !== today() || typeof q.left !== 'number') { box.hidden = true; return; }
    box.textContent = q.left > 0 ? t(`${q.left} requests left today`, `Hôm nay còn ${q.left} lượt`) : t('No requests left today', 'Hôm nay đã hết lượt');
    box.hidden = false;
  };
  const quotaSet = left => { try { localStorage.setItem('translate_left', JSON.stringify({ day: today(), left })); } catch { /* no storage */ } quotaShow(); };
  document.addEventListener('langchange', quotaShow);
  quotaShow();
  const GENERIC = t('Something went wrong. Please try again.', 'Đã xảy ra lỗi. Vui lòng thử lại.');

  // characters as images in the table (js/detail.js, as on the dictionary page); plain text if that script is not there
  const SIZE = 32;
  const chars = (str, size) => (typeof ChunomDetail !== 'undefined' ? ChunomDetail.get().nomChars(str, size) : [str]);

  // ---- the check of the reading of a character of the model's own (the dictionaries of js/ime.js, a compound character by character)
  const readingCache = new Map();
  const readingsOf = ch => {
    if (!readingCache.has(ch)) {
      const set = new Set();
      for (const e of window.VietIme.lookupGlyph(ch)) {
        const s = norm(e.reading).split(' '), cs = [...e.glyph];
        if (s.length === cs.length) cs.forEach((c, i) => { if (c === ch) set.add(s[i]); });
      }
      readingCache.set(ch, set);
    }
    return readingCache.get(ch);
  };
  const verify = (qn, glyphs) => {   // {ok: true}, {ok: false, read} or {ok: undefined}
    if (!(window.VietIme && window.VietIme.lookupGlyph)) return { ok: undefined };
    const cs = [...glyphs], syl = qn.split(' ');
    if (window.VietIme.lookupGlyph(cs[0]).some(e => e.glyph === glyphs && norm(e.reading) === qn)) return { ok: true };
    if (cs.length !== syl.length) return { ok: undefined };
    const bad = []; let unknown = false;
    cs.forEach((c, i) => { const set = readingsOf(c); if (!set.size) unknown = true; else if (!set.has(syl[i])) bad.push([...set].slice(0, 3).join(', ')); });
    if (bad.length) return { ok: false, read: bad.join(' / ') };
    return { ok: unknown ? undefined : true };
  };

  // state of a word: sure (chosen from the list: the reading is right), own (the model's own character, reading found or not confirmed),
  // uncertain (no character, or the reading of the own character is wrong)
  const STATES = {
    sure: { cls: 'sure', icon: 'bi-check-circle-fill', label: () => t('from the list', 'từ danh sách') },
    own: { cls: 'differs', icon: 'bi-question-circle-fill', label: () => t("model's own", 'mô hình tự chọn') },
    uncertain: { cls: 'uncertain', icon: 'bi-exclamation-triangle-fill', label: () => t('uncertain', 'chưa chắc') },
  };
  const rate = w => {
    if (w.chosen === '?') return { state: 'uncertain', why: t('no character found', 'không tìm được chữ') };
    if (!w.own) return { state: 'sure', why: w.options.length > 1 ? t(`chosen from ${Math.min(w.options.length, MAX_SENT)} options`, `chọn trong ${Math.min(w.options.length, MAX_SENT)} lựa chọn`) : t('the only option', 'lựa chọn duy nhất') };
    const v = verify(w.qn, w.chosen);
    if (v.ok === false) return { state: 'uncertain', why: t('the dictionaries read it as “', 'từ điển đọc là “') + v.read + '”' };
    return { state: 'own', why: v.ok ? t('reading found in the dictionaries', 'cách đọc có trong từ điển') : t('reading not confirmed', 'chưa xác nhận cách đọc') };
  };

  // the result as text: every character is a <ruby> with its syllable (one per character if the numbers agree, else the whole reading over
  // the group); a word is underlined by its state. The Quốc Ngữ is not selected when the text is copied.
  const ruby = (nodes, reading) => { const r = document.createElement('ruby'); r.append(...nodes); const rt = document.createElement('rt'); rt.textContent = reading; r.append(rt); return r; };
  const ch = c => { const s = document.createElement('span'); s.className = 'ch'; s.dataset.char = c; s.textContent = c; return s; };
  const wordNodes = w => {
    if (w.chosen === '?') { const x = document.createElement('span'); x.className = 'txt'; x.textContent = `[${w.qn}]`; return [x]; }
    const cs = [...w.chosen], syl = w.qn.split(' ');
    return cs.length === syl.length ? cs.map((c, i) => ruby([ch(c)], syl[i])) : [ruby(cs.map(ch), w.qn)];
  };
  const shown = w => (w.chosen === '?' ? `[${w.qn}]` : w.chosen);

  let lastNom = '';
  const show = (r, full) => {
    const byId = new Map(r.words.map(w => [w.id, w]));
    for (const w of r.words) { w.options = (full.get(w.at + '+' + w.len) || []).map(o => ({ char: o.c, meaning: o.m })); Object.assign(w, rate(w)); }
    lastNom = r.parts.map(p => (p.word ? shown(byId.get(p.word)) : p.text)).join('');
    const box = $('nom'); box.replaceChildren();
    for (const p of r.parts) {
      if (!p.word) { box.append(p.text); continue; }
      const w = byId.get(p.word), st = STATES[w.state];
      const span = document.createElement('span');
      span.className = 'unit ' + st.cls;
      span.title = `${w.qn} · ${st.label()}`;
      span.append(...wordNodes(w));
      box.append(span);
    }
    const unsure = r.words.filter(w => w.state !== 'sure');
    const warn = $('warn'), notes = [];
    if (unsure.length) notes.push(t('Check: ', 'Kiểm tra: ') + unsure.map(w => w.qn).join(', '));
    if (r.fallback) notes.push(t('The model did not manage the segmentation: single syllables, the first option each.', 'Mô hình không tách được từ: từng âm tiết, lựa chọn đầu tiên.'));
    warn.hidden = !notes.length; warn.textContent = notes.join(' ');

    // the table: a line per word; the other options of its span in the last column under the definition
    const el = (tag, cls, ...kids) => { const n = document.createElement(tag); if (cls) n.className = cls; n.append(...kids.flat()); return n; };
    const rows = r.words.map(w => {
      const st = STATES[w.state];
      const mine = w.options.find(o => o.char === w.chosen) || {};
      const others = w.options.filter(o => o.char !== w.chosen);
      const best = (w.alt || []).map(c => others.find(o => o.char === c)).filter(Boolean);
      const alts = best;
      const altLine = a => el('div', 'alt', el('span', 'alt-chars', ...chars(a.char, 24)), el('span', '', a.meaning || ''));
      const status = el('td', '', el('div', '', el('span', 'state ' + st.cls, el('i', 'bi ' + st.icon), ' ', st.label()), ' ', el('span', 'def', '· ' + w.why)),
        mine.meaning ? el('div', 'def', mine.meaning) : '',
        alts.length ? el('div', 'alts', el('div', 'alts-title', t('Alternatives', 'Lựa chọn khác')), alts.map(altLine)) : '');
      return el('tr', '', el('td', '', String(w.id)), el('td', '', w.qn), el('td', 'chars-cell', ...(w.chosen === '?' ? ['?'] : chars(w.chosen, SIZE))), status);
    });
    $('units').replaceChildren(...rows);
    $('translation').textContent = r.translation || ''; $('translation').hidden = !r.translation;
    $('version').textContent = r.version ? t('Prompt version: ', 'Phiên bản prompt: ') + r.version : '';
    $('result').hidden = false;
  };

  // a click on a character opens its popup (js/detail.js), but not while text is selected
  $('result').addEventListener('click', e => {
    const c = e.target.closest('.nom-char, .ch');
    if (!c || String(window.getSelection()).length || typeof ChunomDetail === 'undefined') return;
    ChunomDetail.get().open(c.dataset.char).catch(err => console.error('Popup failed', err));
  });
  // copying selected text of the result: only the characters, without the Quốc Ngữ of the ruby text
  $('nom').addEventListener('copy', e => {
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed) return;
    const tmp = document.createElement('div');
    for (let i = 0; i < sel.rangeCount; i++) tmp.append(sel.getRangeAt(i).cloneContents());
    tmp.querySelectorAll('rt').forEach(n => n.remove());
    e.clipboardData.setData('text/plain', tmp.textContent);
    e.preventDefault();
  });
  // the Quốc Ngữ above the characters can be hidden (remembered in this browser)
  const rtBox = $('rt-toggle'), rtSet = on => { $('nom').classList.toggle('no-rt', !on); rtBox.checked = on; };
  const langBox = $('lang');
  try { const saved = localStorage.getItem('translate_target'); langBox.value = saved !== null ? saved : 'en'; if (langBox.value !== saved && saved !== null) langBox.value = 'en'; } catch { langBox.value = 'en'; }
  langBox.addEventListener('change', () => { try { localStorage.setItem('translate_target', langBox.value); } catch { /* no storage */ } });
  try { rtSet(localStorage.getItem('translate_rt') !== '0'); } catch { /* no storage */ }
  rtBox.addEventListener('change', () => { rtSet(rtBox.checked); try { localStorage.setItem('translate_rt', rtBox.checked ? '1' : '0'); } catch { /* no storage */ } });

  go.addEventListener('click', async () => {
    const value = text.value.trim();
    if (!value) return say(ERRORS.empty, true);
    if (!(await QattLogin.require(sp, t('Sign in to use the translator.', 'Đăng nhập để dùng công cụ dịch.')))) return;
    go.disabled = true; $('result').hidden = true;
    say(''); $('loading').hidden = false;
    try {
      const [csv] = await Promise.all([csvReady, imeReady]);
      const { spans, full } = buildSpans(value, csv);
      $('lists').textContent = spans.map(s => `${s.at}+${s.len}  ${s.options.map(o => o.c + (o.s ? '*' : '')).join(' ')}`).join('\n');
      const session = (await sp.client.auth.getSession()).data.session;
      const res = await fetch(`${sp.url}/functions/v1/translate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: sp.key, Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ text: value, spans, lang: $('lang').value }),
      });
      if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || 'failed'); }
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = '', done = false;
      while (true) {
        const { value: chunk, done: end } = await reader.read();
        if (chunk) buf += dec.decode(chunk, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        if (end && buf.trim()) lines.push(buf);
        for (const line of lines) {
          if (!line.trim()) continue;
          const m = JSON.parse(line);
          if (m.error) throw new Error(m.error);
          if (m.result) { show(m.result, full); if (typeof m.result.left === 'number') quotaSet(m.result.left); say(''); done = true; }
        }
        if (end) break;
      }
      if (!done) throw new Error('failed');
    } catch (e) {
      if (e.message === 'limit') quotaSet(0);
      say(ERRORS[e.message] || GENERIC, true);
    } finally {
      go.disabled = false; $('loading').hidden = true;
    }
  });

  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(lastNom); say(t('Copied.', 'Đã sao chép.')); setTimeout(() => say(''), 1500); } catch { /* no clipboard permission */ }
  });
});
</script>
</body>
</html>
