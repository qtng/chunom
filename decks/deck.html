<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qatt.org - Deck</title>
    
    <!-- Bootstrap 5.3 -->
    <link href="https://qatt.org/qatt/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://qatt.org/qatt/vendor/bootstrap-icons/bootstrap-icons.min.css">
    
    <!-- Nom Fonts -->
    <link rel="stylesheet" href="https://qatt.org/chunom-assets/fonts/fonts.css">

    <script src="https://qatt.org/qatt/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://qatt.org/qatt/vendor/supabase/supabase.min.js"></script>
    <script src="../../qatt/js/navigation.js"></script>
    <script src="../../qatt/js/supabase.js"></script>
    <script src="deck-cover.js"></script>
    <script src="../../qatt/js/login.js"></script>
    <script src="../../qatt/js/qatt.js"></script>
    <script src="../../qatt/js/parser.js"></script>
    <script src="../js/detail.js"></script>

    <style>
        :root { --ink: #2b2118; --cinnabar: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; }

        body {
            min-height: 100vh;
            color: var(--ink);
            background: linear-gradient(180deg, var(--paper) 0, #fffdf8 18rem) no-repeat, #fffdf8;
        }

        .page-title { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2rem, 7vw, 2.8rem); }
        .accent { color: var(--cinnabar) !important; }
        .btn-outline-accent { color: var(--cinnabar); border-color: var(--cinnabar); }
        .btn-outline-accent:hover { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }
        .text-secondary { color: var(--muted) !important; }

        /* quiet text buttons without hover or focus highlights */
        .btn-subtle {
            all: unset;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.6rem;
            cursor: pointer;
            color: var(--muted);
            font-size: 0.925rem;
            font-weight: 500;
            user-select: none;
            border-radius: 2rem;
        }
        .btn-subtle:hover { color: var(--cinnabar); }
        .btn-subtle:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 2px; }

        /* deck menu (edit, delete) */
        .deck-menu-btn { color: var(--muted); border: 0; background: none; padding: .2rem .5rem; border-radius: 2rem; }
        .deck-menu-btn:hover, .deck-menu-btn:focus-visible { color: var(--cinnabar); background: rgba(168, 54, 42, .08); }
        .dropdown-menu { border-color: var(--line); border-radius: .8rem; }

        /* edit dialog: entries of a deck */
        .entry-row { display: flex; align-items: center; gap: .8rem; padding: .4rem .2rem; border-bottom: 1px solid var(--line); }
        .entry-row .glyph { min-width: 4.2rem; text-align: left; white-space: nowrap; font-family: 'Nom Na Tong Supplement', 'pa', serif; font-size: 1.6rem; }
        /* the characters of the deck page: a grid, one column on the phone */
        #deck-words { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr)); gap: .6rem; }
        .deck-item { display: flex; align-items: center; gap: .8rem; padding: .5rem .9rem; background: rgba(255, 255, 255, .8); border: 1px solid var(--line); border-radius: .8rem; color: var(--ink); text-decoration: none; transition: border-color .15s, box-shadow .15s; }
        .deck-item:hover, .deck-item:focus-visible { border-color: var(--cinnabar); box-shadow: 0 .2rem .6rem rgba(60, 40, 20, .08); color: var(--ink); }
        .deck-item .glyph { min-width: 4.2rem; white-space: nowrap; font-family: 'Nom Na Tong Supplement', 'pa', serif; font-size: 1.6rem; }
        .entry-row .btn-remove { color: var(--muted); border: 0; background: none; padding: .2rem .5rem; border-radius: 2rem; }
        .entry-row .btn-remove:hover, .entry-row .btn-remove:focus-visible { color: var(--cinnabar); background: rgba(168, 54, 42, .08); }

        /* deck cards */
        .list-group { border: none !important; }
        .list-group-item {
            background-color: rgba(255, 255, 255, .8) !important;
            border: 1px solid var(--line) !important;
            border-radius: .8rem !important;
            color: var(--ink);
            margin-bottom: 0.6rem;
            transition: border-color .15s, box-shadow .15s;
        }
        .deck-title { font-weight: 600; color: var(--ink); }
        .empty-box { background: rgba(255, 255, 255, .6); border: 1px dashed var(--field); }

        .section-header { border: none !important; }
        .account-footer { margin-top: 3rem; text-align: center; font-size: .85rem; color: var(--muted); }
        .account-footer a { color: var(--cinnabar); text-decoration: none; }
        .account-footer a:hover { text-decoration: underline; }
        .deck-menu-btn { width: 2rem; height: 2rem; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); border: 1px solid var(--field); background: #fff; border-radius: 50%; padding: 0; }
        .deck-menu-btn:hover, .deck-menu-btn:focus-visible, .deck-menu-btn.show { color: var(--cinnabar); border-color: var(--cinnabar); }
        .dropdown-menu { border-color: var(--line); border-radius: .8rem; }
        .section-header h6 { letter-spacing: .12em; }

        /* modal */
        .modal-content { background: #fffdf8; color: var(--ink); border-radius: 1rem; }
        .modal-content .form-control { border-color: var(--field); background-color: #fff; color: var(--ink); }
        .modal-content .form-control:focus { border-color: var(--cinnabar); box-shadow: 0 0 0 .2rem rgba(168, 54, 42, .15) !important; }
        .btn-cinnabar { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; border-radius: 2rem; }
        .btn-cinnabar:hover, .btn-cinnabar:focus-visible { background: #8c2c22; border-color: #8c2c22; color: #fff; }
        /* like a profile picture: a rounded square next to the title */
        .deck-head { display: flex; align-items: center; gap: 1rem; text-align: left; }
        .deck-cover-slot { flex: none; }
        .deck-cover { display: block; width: 5rem; height: 5rem; object-fit: cover; border-radius: 1.1rem; }
        .deck-head-text { flex: 1; min-width: 0; }
        .deck-head-text .page-title { font-size: clamp(1.6rem, 6vw, 2.4rem); overflow-wrap: anywhere; }
        @media (min-width: 768px) { .deck-head { gap: 1.5rem; } .deck-cover { width: 6.5rem; height: 6.5rem; border-radius: 1.4rem; } }
        .cover-preview { width: 5rem; height: 5rem; object-fit: cover; border-radius: 1.1rem; margin-bottom: .5rem; }
        .btn-cancel { border-radius: 2rem; background: #fff; border: 1px solid var(--field); color: var(--ink); }
        .btn-cancel:hover { background: #f1e8d2; color: var(--ink); }
    </style>
</head>
<body>

    <div class="container py-3 pb-5" style="max-width: 62rem">
        <div class="row justify-content-center text-center">
            <div class="col-12">
                
                <!-- Header -->
                <div class="text-start mt-2"><a href="index.html" class="btn-subtle"><i class="bi bi-arrow-left"></i> Practice / Decks</a></div>
                <div class="deck-head mt-2 mb-3">
                    <div id="deck-cover-slot" class="deck-cover-slot"></div>
                    <div class="deck-head-text">
                        <h1 class="page-title mb-1" id="deck-title">Deck</h1>
                        <p class="text-secondary mb-0" id="deck-meta"></p>
                    </div>
                </div>
                <div class="d-flex flex-wrap justify-content-start gap-2 mb-4" id="deck-actions"></div>
                <div class="text-start mb-5">
                    <h6 class="text-secondary text-uppercase pb-2 mb-2 small section-header">Characters</h6>
                    <div id="deck-words">
                        <div class="text-center p-5 text-secondary">
                            <div class="spinner-border spinner-border-sm accent mb-2" role="status"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <footer id="account" class="account-footer"></footer>
    </div>

    <!-- Edit Deck Modal -->
    <div class="modal fade" id="editDeckModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Edit Deck</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body border-0">
                    <div class="mb-4">
                        <label for="editTitleInput" class="form-label text-secondary small text-uppercase">Deck Title</label>
                        <input type="text" class="form-control shadow-none" id="editTitleInput" maxlength="80">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary small text-uppercase">Cover image</label>
                        <img id="coverPreview" class="cover-preview d-none" alt="">
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <input type="file" id="coverInput" accept="image/*" class="d-none">
                            <label for="coverInput" class="btn btn-sm btn-outline-secondary rounded-pill px-3 mb-0"><i class="bi bi-image me-1"></i> Choose image</label>
                            <button type="button" class="btn btn-sm btn-link text-secondary d-none" id="coverRemove">Remove</button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="publicInput">
                            <label class="form-check-label" for="publicInput">Publish in the catalog</label>
                        </div>
                        <div class="form-text" id="publicHint">Everybody can find the deck, learn it and see your user name. You can take it back at any time.</div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <h6 class="text-secondary text-uppercase mb-0 small">Characters</h6>
                        <span id="editCount" class="text-secondary small"></span>
                    </div>
                    <div id="editWords"></div>
                    <p class="text-secondary small mt-3 mb-0">Add characters in the dictionary: open a character and tap “Add to deck”.</p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-cancel shadow-none" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-cinnabar px-4 fw-bold shadow-none" id="saveEditBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class DeckPage {
            constructor() {
                this.sp = new SupabaseService();
                this.id = new URLSearchParams(location.search).get('id');
                this.deck = null;
            }

            async init() {
                try {
                    await this.sp.init();
                    this.renderAccount();
                    document.getElementById('saveEditBtn').addEventListener('click', () => this.saveEdit());
                    document.getElementById('coverInput').addEventListener('change', e => this.pickCover(e.target.files[0]));
                    document.getElementById('coverRemove').addEventListener('click', () => this.setCover(null));
                    // a character was added to or removed from this deck in the popup: show the new list
                    document.addEventListener('chunom:deckchange', e => { if (e.detail.deckId === this.id) this.load(); });
                    await this.load();
                } catch (e) {
                    console.error("Deck Init Error:", e);
                }
            }

            // footer: who is signed in, with a sign-out link (nothing when not signed in)
            renderAccount() {
                const box = document.getElementById('account');
                box.replaceChildren();
                if (!this.signedIn()) return;
                const out = document.createElement('a');
                out.href = '#';
                out.textContent = 'Sign out';
                out.addEventListener('click', async e => { e.preventDefault(); await this.sp.signOut(); location.reload(); });
                box.append(`Signed in as ${this.sp.user.email || 'you'} · `, out);
            }

            signedIn() {
                return !!this.sp.user && !this.sp.isAnonymous;
            }

            get isOwner() {
                return !!this.deck?.id && this.deck.user_id === this.sp.user?.id;
            }

            async load() {
                this.deck = this.id ? await this.sp.getDeck(this.id) : {};
                if (!this.deck?.id) {
                    document.getElementById('deck-cover-slot').replaceChildren();
                    document.getElementById('deck-title').textContent = 'Deck not found';
                    document.getElementById('deck-actions').replaceChildren(this.link('index.html', 'bi-arrow-left', 'All decks', 'btn btn-sm btn-outline-accent rounded-pill px-3'));
                    document.getElementById('deck-words').replaceChildren();
                    return;
                }
                const words = this.words();
                document.title = `${this.deck.title} | Qatt.org`;
                document.getElementById('deck-title').textContent = this.deck.title;
                document.getElementById('deck-meta').textContent = `${words.length} items`;
                document.getElementById('deck-cover-slot').replaceChildren(DeckCover.element(this.deck, this.sp.deckImageUrl(this.deck.image_path), 'deck-cover'));
                this.renderActions();
                this.renderWords(words);
            }

            words() {
                return (this.deck.words || []).filter(w => w.n !== '.config');
            }

            link(href, icon, text, cls) {
                const a = document.createElement('a');
                a.href = href;
                a.className = cls;
                a.innerHTML = `<i class="bi ${icon} me-1"></i> `;
                a.append(text);
                return a;
            }

            button(icon, text, cls, onclick) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = cls;
                b.innerHTML = `<i class="bi ${icon} me-1"></i> `;
                b.append(text);
                b.addEventListener('click', onclick);
                return b;
            }

            renderActions() {
                const actions = [
                    this.link(`immersive.html?id=${this.deck.id}`, 'bi-headphones', 'Superlearn', 'btn btn-sm btn-cinnabar px-3'),
                    this.link(`practice.html?id=${this.deck.id}`, 'bi-lightning-charge-fill', 'Practice', 'btn btn-sm btn-outline-accent rounded-pill px-3')
                ];
                // editing and deleting: in a menu behind an icon button
                if (this.isOwner) {
                    const menu = document.createElement('div');
                    menu.className = 'dropdown';
                    menu.innerHTML = `
                        <button type="button" class="deck-menu-btn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Deck options" title="Deck options"><i class="bi bi-three-dots"></i></button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                            <li><button type="button" class="dropdown-item" data-act="edit"><i class="bi bi-pencil me-2"></i>Edit deck or items</button></li>
                            <li><button type="button" class="dropdown-item text-danger" data-act="delete"><i class="bi bi-trash me-2"></i>Delete the whole deck</button></li>
                        </ul>`;
                    menu.querySelector('[data-act=edit]').addEventListener('click', () => this.openEdit());
                    menu.querySelector('[data-act=delete]').addEventListener('click', () => this.deleteDeck());
                    actions.push(menu);
                }
                document.getElementById('deck-actions').replaceChildren(...actions);
            }

            renderWords(words) {
                const rows = words.map(word => {
                    const qn = document.createElement('span');
                    qn.className = 'flex-grow-1';
                    qn.lang = 'vi';
                    qn.textContent = word.qn || '';
                    const row = document.createElement('a');
                    row.className = 'deck-item';
                    row.href = `../index.html?detail=${encodeURIComponent(word.n || '')}`; // opens the character in the dictionary
                    row.title = 'Show in the dictionary';
                    row.addEventListener('click', e => { // the popup of the character; the link above is the fallback (middle click, no script)
                        if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
                        e.preventDefault();
                        ChunomDetail.open(word.n || '');
                    });
                    row.append(this.glyph(word.n || ''), qn);
                    if (word.qn) row.append(ChunomDetail.speakButton(word.qn));
                    return row;
                });
                if (!rows.length) {
                    const empty = document.createElement('div');
                    empty.className = 'p-4 text-center text-secondary small empty-box rounded-3';
                    empty.style.gridColumn = '1 / -1';
                    empty.textContent = 'This deck is empty.';
                    rows.push(empty);
                }
                document.getElementById('deck-words').replaceChildren(...rows);
            }

            // an item as images (one per character) with the font as fallback, like in the dictionary
            glyph(nom) {
                const box = document.createElement('span');
                box.className = 'glyph';
                for (const ch of Array.from(nom)) {
                    if (!/^[\u4e00-\u9fff\u3400-\u4dbf\u{20000}-\u{323af}]$/u.test(ch)) {
                        box.append(ch);
                        continue;
                    }
                    const img = new Image(32, 32);
                    img.alt = ch;
                    img.style.verticalAlign = 'middle';
                    const hex = ch.codePointAt(0).toString(16).toUpperCase();
                    img.addEventListener('error', () => img.replaceWith(ch));
                    img.src = `https://qatt.org/chunom-assets/generated/32/${hex}.webp`;
                    box.append(img);
                }
                return box;
            }

            async openEdit() {
                const deck = this.deck;
                if (!this.isOwner) return;
                this.editing = { id: deck.id, words: deck.words || [], removed: new Set(), cover: undefined }; // cover: undefined = unchanged, null = remove, Blob = new
                document.getElementById('coverInput').value = '';
                this.showCover(this.sp.deckImageUrl(deck.image_path));
                document.getElementById('editTitleInput').value = deck.title || '';
                const pub = document.getElementById('publicInput');
                pub.checked = !!deck.is_public;
                pub.disabled = this.sp.isAnonymous && !deck.is_public; // publishing needs a signed-in account
                document.getElementById('publicHint').textContent = pub.disabled
                    ? 'Sign in to publish a deck.'
                    : 'Everybody can find the deck, learn it and see your user name. You can take it back at any time.';
                this.renderEditWords();
                bootstrap.Modal.getOrCreateInstance(document.getElementById('editDeckModal')).show();
            }

            showCover(url) {
                const img = document.getElementById('coverPreview');
                img.classList.toggle('d-none', !url);
                if (url) img.src = url;
                document.getElementById('coverRemove').classList.toggle('d-none', !url);
            }

            // cuts the middle square out of the chosen photo and scales it to at most 512 x 512 px as WebP (about 20 KB), or as JPEG when the browser cannot write WebP
            async pickCover(file) {
                if (!file) return;
                try {
                    const bmp = await createImageBitmap(file);
                    const side = Math.min(bmp.width, bmp.height);
                    const canvas = document.createElement('canvas');
                    canvas.width = canvas.height = Math.min(512, side);
                    canvas.getContext('2d').drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, canvas.width, canvas.height);
                    let blob = await new Promise(res => canvas.toBlob(res, 'image/webp', 0.8));
                    // browsers that cannot write WebP hand back a PNG, which is much larger: use JPEG then
                    if (!blob || blob.type !== 'image/webp') blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
                    if (!blob) throw new Error('empty');
                    this.setCover(blob);
                } catch (e) {
                    alert('This image could not be read. Please choose a JPEG, PNG or WebP file.');
                }
            }

            setCover(blob) {
                this.editing.cover = blob;
                this.showCover(blob ? URL.createObjectURL(blob) : null);
            }

            renderEditWords() {
                const { words, removed } = this.editing;
                const shown = words.filter(w => w.n !== '.config' && !removed.has(w));
                document.getElementById('editCount').textContent = `${shown.length} items`;
                const rows = shown.map(word => {
                    const qn = document.createElement('span');
                    qn.className = 'flex-grow-1';
                    qn.lang = 'vi';
                    qn.textContent = word.qn || '';
                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.className = 'btn-remove';
                    remove.title = 'Remove';
                    remove.setAttribute('aria-label', 'Remove');
                    remove.innerHTML = '<i class="bi bi-trash"></i>';
                    remove.addEventListener('click', () => { removed.add(word); this.renderEditWords(); });
                    const row = document.createElement('div');
                    row.className = 'entry-row';
                    row.append(this.glyph(word.n || ''), qn, remove);
                    return row;
                });
                if (!rows.length) {
                    const empty = document.createElement('div');
                    empty.className = 'p-4 text-center text-secondary small empty-box rounded-3';
                    empty.style.gridColumn = '1 / -1';
                    empty.textContent = 'This deck is empty.';
                    rows.push(empty);
                }
                document.getElementById('editWords').replaceChildren(...rows);
            }

            async saveEdit() {
                const { id, words, removed, cover } = this.editing;
                const btn = document.getElementById('saveEditBtn');
                btn.disabled = true;
                const title = document.getElementById('editTitleInput').value.trim() || 'Untitled Deck';
                const { error } = await this.sp.saveDeck({ id, title, words: words.filter(w => !removed.has(w)) });
                const pub = document.getElementById('publicInput');
                let pubError = null;
                if (!error && !pub.disabled && pub.checked !== !!this.deck.is_public) pubError = (await this.sp.setDeckPublic(id, pub.checked)).error;
                let imgError = null;
                if (!error && cover !== undefined) {
                    imgError = (cover ? await this.sp.setDeckImage(id, cover) : await this.sp.removeDeckImage(id)).error;
                }
                btn.disabled = false;
                if (pubError && /at most 10/.test(pubError.message || '')) return alert('You can publish at most 10 decks. Take one back first.');
                if (error || imgError || pubError) return alert('Could not save the deck, please try again.');
                bootstrap.Modal.getInstance(document.getElementById('editDeckModal')).hide();
                await this.load();
            }

            async deleteDeck() {
                const deck = this.deck;
                if (!this.isOwner || !confirm(`Delete the deck "${deck.title}"? This cannot be undone.`)) return;
                const { error } = await this.sp.deleteDeck(deck.id);
                if (error) return alert('Could not delete the deck, please try again.');
                location.href = 'index.html';
            }
        }

        const page = new DeckPage();
        window.onload = () => page.init();
    </script>
</body>
</html>
