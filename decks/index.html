<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qatt.org - Practice / Decks</title>
    
    <!-- Bootstrap 5.3 -->
    <link href="https://qatt.org/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://qatt.org/css/site.css">
    <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap-icons/bootstrap-icons.min.css">
    
    <!-- Nom Fonts -->
    <link rel="stylesheet" href="/chunom-assets/fonts/fonts.css">

    <script src="https://qatt.org/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://qatt.org/vendor/supabase/supabase.min.js"></script>
    <script src="https://qatt.org/js/navigation.js"></script>
    <script src="https://qatt.org/js/supabase.js"></script>
    <script src="deck-cover.js"></script>
    <script src="https://qatt.org/js/login.js"></script>

    <style>
        :root { --ink: #2b2118; --cinnabar: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; }
        body { min-height: 100vh; color: var(--ink); background: #fffdf8; }
        /* the header of the pages of qatt.org and the Chunom site (.hero): the look of the theme "classic"; other themes override it */
        .hero {
            background:
                radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
                linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
            border-bottom: 1px solid #e8dcc0;
            color: var(--ink);
        }
        .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; }
        .hero .han { color: var(--cinnabar); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
        .hero .han { font-family: 'Nom Na Tong Supplement', 'NomKhai-Supplement', 'Han-Nom Gothic Supplement', serif; }   /* Nôm characters outside the usual fonts */
        .hero .lead { max-width: 38rem; color: #4a3d30; }
        @media (max-width: 575.98px) { .hero .han { letter-spacing: .3em; } }
        .card-box { padding: 1rem; margin-bottom: .6rem; background: #fffdf8; border: 1px solid var(--line); border-radius: .7rem; box-shadow: 0 .35rem 1rem rgba(60, 40, 20, .14); }

        .accent { color: var(--cinnabar) !important; }
        .text-secondary { color: var(--muted) !important; }
        .section-header h6 { letter-spacing: .12em; }

        /* deck cards */
        .deck-thumb { width: 4rem; height: 4rem; object-fit: cover; border-radius: .9rem; flex: none; }
        .deck-title { font-weight: 600; }
        .empty-box { background: color-mix(in srgb, currentColor 4%, transparent); border: 1px dashed var(--field); }

        /* grey placeholders while the decks load: the same layout as a deck card, so nothing jumps */
        .sk-block { display: block; border-radius: .5rem; background: linear-gradient(90deg, color-mix(in srgb, currentColor 12%, transparent) 25%, color-mix(in srgb, currentColor 6%, transparent) 50%, color-mix(in srgb, currentColor 12%, transparent) 75%); background-size: 200% 100%; animation: sk-shimmer 1.4s linear infinite; }
        .sk-thumb { width: 4rem; height: 4rem; border-radius: .9rem; flex: none; }
        .sk-line { height: 1.1rem; margin: .15rem 0 .5rem; }
        .sk-sm { height: .8rem; }
        .sk-btn { height: 1.9rem; width: 6.5rem; border-radius: 50rem; }
        @keyframes sk-shimmer { to { background-position: -200% 0; } }
        @media (prefers-reduced-motion: reduce) { .sk-block { animation: none; } }
        .deck-progress { height: 6px; background: color-mix(in srgb, currentColor 10%, transparent); }
        .deck-progress .progress-bar { transition: width .4s; }

        .account-footer { margin-top: 3rem; text-align: center; font-size: .85rem; color: var(--muted); }
        .account-footer a { color: var(--cinnabar); text-decoration: none; }
        .account-footer a:hover { text-decoration: underline; }

        /* modal */
        .modal-content { background: #fffdf8; color: var(--ink); border-radius: 1rem; }
        .modal-content .form-control { border-color: var(--field); background-color: #fff; color: var(--ink); }
        .modal-content .form-control:focus { border-color: var(--cinnabar); box-shadow: 0 0 0 .2rem rgba(168, 54, 42, .15) !important; }
    </style>
</head>
<body>

    <header class="hero pt-5 pb-4 mb-4">
        <div class="container text-center">
            <div class="han mb-2">學𡨸喃</div>
            <h1 class="mb-3" data-vi="Luyện tập / Bộ thẻ">Practice / decks</h1>
            <p class="lead mx-auto mb-4">Practice Chữ Nôm with the words of your own and public decks.</p>
            <button type="button" class="btn btn-cinnabar btn-pill" data-bs-toggle="modal" data-bs-target="#createDeckModal"><i class="bi bi-plus-lg me-1"></i> <span data-vi="Tạo bộ thẻ mới">Create new deck</span></button>
            <a class="btn btn-cinnabar btn-pill" href="/chunom/index.html" data-vi="Tra cứu chữ">Character search</a>
        </div>
    </header>
    <main class="container pb-5" style="max-width: 62rem">
        <div class="row justify-content-center text-center">
            <div class="col-lg-10">

                <!-- Personal Decks Section -->
                <div class="text-start mb-5">
                    <div class="pb-2 mb-3 section-header">
                        <h6 class="text-secondary text-uppercase mb-0 small" data-vi="Bộ thẻ của tôi">My decks</h6>
                    </div>

                    <div id="deck-list">
                        <div role="status"><span class="visually-hidden">Loading personal decks...</span></div>
                            <div class="card-box" aria-hidden="true">
                                <div class="d-flex align-items-start gap-3">
                                    <span class="sk-block sk-thumb"></span>
                                    <div class="flex-grow-1"><span class="sk-block sk-line" style="width: 55%"></span><span class="sk-block sk-line sk-sm" style="width: 30%"></span></div>
                                </div>
                                <div class="d-flex gap-2 mt-3"><span class="sk-block sk-btn"></span><span class="sk-block sk-btn"></span><span class="sk-block sk-btn ms-auto"></span></div>
                            </div>
                            <div class="card-box" aria-hidden="true">
                                <div class="d-flex align-items-start gap-3">
                                    <span class="sk-block sk-thumb"></span>
                                    <div class="flex-grow-1"><span class="sk-block sk-line" style="width: 55%"></span><span class="sk-block sk-line sk-sm" style="width: 30%"></span></div>
                                </div>
                                <div class="d-flex gap-2 mt-3"><span class="sk-block sk-btn"></span><span class="sk-block sk-btn"></span><span class="sk-block sk-btn ms-auto"></span></div>
                            </div>
                    </div>
                </div>

                <!-- Public Decks Section -->
                <div class="text-start mb-5">
                    <div class="pb-2 mb-3 section-header"><h6 class="text-secondary text-uppercase mb-0 small" data-vi="Danh mục bộ thẻ">Deck catalog</h6></div>
                    <div id="public-deck-list">
                        <div role="status"><span class="visually-hidden">Loading public decks...</span></div>
                            <div class="card-box" aria-hidden="true">
                                <div class="d-flex align-items-start gap-3">
                                    <span class="sk-block sk-thumb"></span>
                                    <div class="flex-grow-1"><span class="sk-block sk-line" style="width: 55%"></span><span class="sk-block sk-line sk-sm" style="width: 30%"></span></div>
                                </div>
                                <div class="d-flex gap-2 mt-3"><span class="sk-block sk-btn"></span><span class="sk-block sk-btn"></span><span class="sk-block sk-btn ms-auto"></span></div>
                            </div>
                            <div class="card-box" aria-hidden="true">
                                <div class="d-flex align-items-start gap-3">
                                    <span class="sk-block sk-thumb"></span>
                                    <div class="flex-grow-1"><span class="sk-block sk-line" style="width: 55%"></span><span class="sk-block sk-line sk-sm" style="width: 30%"></span></div>
                                </div>
                                <div class="d-flex gap-2 mt-3"><span class="sk-block sk-btn"></span><span class="sk-block sk-btn"></span><span class="sk-block sk-btn ms-auto"></span></div>
                            </div>
                            <div class="card-box" aria-hidden="true">
                                <div class="d-flex align-items-start gap-3">
                                    <span class="sk-block sk-thumb"></span>
                                    <div class="flex-grow-1"><span class="sk-block sk-line" style="width: 55%"></span><span class="sk-block sk-line sk-sm" style="width: 30%"></span></div>
                                </div>
                                <div class="d-flex gap-2 mt-3"><span class="sk-block sk-btn"></span><span class="sk-block sk-btn"></span><span class="sk-block sk-btn ms-auto"></span></div>
                            </div>
                    </div>
                </div>
                
            </div>
        </div>
        <footer id="account" class="account-footer"></footer>
    </main>

    <!-- Create Deck Modal -->
    <div class="modal fade" id="createDeckModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="modal-title" data-vi="Bộ thẻ mới">New deck</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body border-0">
                    <div class="mb-3">
                        <label for="deckTitleInput" class="form-label text-secondary small text-uppercase" data-vi="Tên bộ thẻ">Deck title</label>
                        <input type="text" class="form-control shadow-none" id="deckTitleInput" placeholder="e.g. Basic Verbs">
                        <div class="invalid-feedback">Please enter a title.</div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-quiet" data-bs-dismiss="modal" data-vi="Hủy">Cancel</button>
                    <button type="button" class="btn btn-cinnabar px-4 fw-bold" id="submitCreateBtn">
                        <span id="btnText">Create</span>
                        <div id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class SuperlearningDashboard {
            constructor() {
                this.sp = new SupabaseService();
                this.isCreating = false;
                this.personalDecks = [];
                this.publicDecks = [];
            }

            async init() {
                try {
                    await this.sp.init();
                    this.renderAccount();
                    this.setupEventListeners();
                    await this.loadLists();
                } catch (e) {
                    console.error("Dashboard Init Error:", e);
                }
            }

            setupEventListeners() {
                const modalEl = document.getElementById('createDeckModal');
                const titleInput = document.getElementById('deckTitleInput');
                const submitBtn = document.getElementById('submitCreateBtn');

                // new decks only with a login: anonymous users get the sign-in dialog instead
                modalEl.addEventListener('show.bs.modal', e => {
                    if (!this.signedIn()) {
                        e.preventDefault();
                        QattLogin.open(this.sp, (window.Lang ? Lang.t('Sign in to create decks. The decks you have so far stay with your account.', 'Đăng nhập để tạo bộ thẻ. Các bộ thẻ bạn đã có sẽ được giữ trong tài khoản của bạn.') : 'Sign in to create decks. The decks you have so far stay with your account.'));
                    }
                });
                modalEl.addEventListener('shown.bs.modal', () => titleInput.focus());
                modalEl.addEventListener('hidden.bs.modal', () => {
                    if (!this.isCreating) {
                        titleInput.value = '';
                        titleInput.classList.remove('is-invalid');
                    }
                });

                submitBtn.addEventListener('click', () => this.handleCreateDeck());
                titleInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !this.isCreating) this.handleCreateDeck();
                });
            }

            async loadLists() {
                const [own, saved, publicDecks, progress] = await Promise.all([
                    this.sp.getDecks({ words: true }) || [],
                    this.sp.getSavedDecks?.({ words: true }) || [],
                    this.sp.getPublicDecks() || [],
                    this.signedIn() ? this.sp.getProgress().catch(() => ({})) : {}
                ]);
                // key of a word -> number of correct answers (no bar if the progress could not be loaded)
                this.correct = progress && progress.rows ? new Map(progress.rows.map(r => [r.key, r.correct])) : null;
                // taken-over public decks are in "My decks", not in the catalog
                const savedIds = new Set(saved.map(d => d.id));
                this.owners = await this.sp.getUsernames?.([...saved, ...publicDecks].map(d => d.user_id)) || {};
                this.personalDecks = [...own, ...saved];
                this.publicDecks = publicDecks.filter(d => !savedIds.has(d.id));

                // one list failing must not keep the other from showing
                for (const [id, list, mine] of [['deck-list', this.personalDecks, true], ['public-deck-list', this.publicDecks, false]]) {
                    try { this.renderList(id, list, mine); } catch (e) { console.error(`Rendering ${id} failed:`, e); }
                }
            }

            renderList(containerId, data, isPersonal) {
                const el = document.getElementById(containerId);
                if (!data || data.length === 0) {
                    let emptyHtml = '<div class="p-4 text-center text-secondary rounded-3 small empty-box">';
                    if (containerId !== 'deck-list') {
                        emptyHtml += 'No decks found.';
                    } else if (this.signedIn()) {
                        emptyHtml += `No decks found.
                            <div class="mt-2">
                                <button class="btn btn-sm btn-link accent text-decoration-none p-0 border-0 shadow-none"
                                        data-bs-toggle="modal" data-bs-target="#createDeckModal">
                                    Create your first deck now
                                </button>
                            </div>`;
                    } else {
                        emptyHtml += `<span data-vi="Đăng nhập để xem các bộ thẻ của bạn.">Sign in to see your own decks.</span>
                            <div class="mt-2"><button type="button" class="btn btn-sm btn-cinnabar px-3" id="signin-decks" data-vi="Đăng nhập">Sign in</button></div>`;
                    }
                    emptyHtml += `</div>`;
                    el.innerHTML = emptyHtml;
                    el.querySelector('#signin-decks')?.addEventListener('click', () => QattLogin.open(this.sp));
                    return;
                }

                el.innerHTML = data.map(d => { const pr = isPersonal ? this.progressOf(d) : null; return `
                    <div class="card-box">
                        <div class="d-flex align-items-start gap-3">
                            <span class="deck-thumb-slot" data-deck="${d.id}"></span>
                            <div class="text-start flex-grow-1">
                                <div class="deck-title">${this.escape(d.title)}</div>
                                <small class="text-secondary">${d.words ? d.words.length : (d.count || 0)} items${this.byline(d, isPersonal)}</small>
                                ${pr ? `<div class="progress deck-progress mt-2" role="progressbar" aria-valuemin="0" aria-valuemax="${pr.total}" aria-valuenow="${pr.done}"><div class="progress-bar bg-info" style="width: ${Math.round(pr.done / pr.total * 100)}%"></div></div>
                                <small class="text-secondary"><span>${pr.done} / ${pr.total}</span> <span data-vi="đã học">learned</span></small>` : ''}
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-2 mt-3">
                            <a href="immersive.html?id=${d.id}" class="btn btn-sm btn-cinnabar px-3"><i class="bi bi-headphones me-1"></i> Superlearn</a>
                            <a href="practice.html?id=${d.id}" class="btn btn-sm btn-quiet px-3"><i class="bi bi-lightning-charge-fill"></i> <span data-vi="Luyện tập">Practice</span></a>
                            ${d.saved ? `<button type="button" class="btn btn-sm btn-link text-secondary text-decoration-none ms-auto" data-remove="${d.id}"><i class="bi bi-x-lg me-1"></i>Remove</button>` : '<span class="ms-auto"></span>'}
                            <a href="deck.html?id=${d.id}" class="btn btn-sm btn-quiet px-3" data-vi="Chi tiết">Details</a>
                        </div>
                    </div>
                `; }).join('');
                el.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', async () => {
                    const d = data.find(x => x.id === btn.dataset.remove);
                    if (!confirm(`Remove "${d.title}" from My decks? Your progress is kept.`)) return;
                    btn.disabled = true;
                    const { error } = await this.sp.removeSavedDeck(d.id);
                    if (error) { btn.disabled = false; alert('Could not remove the deck, please try again.'); return; }
                    this.loadLists();
                }));
                el.querySelectorAll('.deck-thumb-slot').forEach(slot => {
                    const d = data.find(x => x.id === slot.dataset.deck);
                    if (window.DeckCover) slot.replaceWith(DeckCover.element(d, this.sp.deckImageUrl(d.image_path), 'deck-thumb'));
                    else slot.remove(); // deck-cover.js not loaded (yet): the list works without thumbnails
                });
            }

            // how many words of a deck are learned: { done, total } or null. The words and the key ("quốc ngữ|Nôm") are the ones of
            // practice.html (only words with Nôm characters are practised); a word counts as learned after 4 correct answers (requiredCorrect).
            progressOf(d) {
                if (!this.correct || !Array.isArray(d.words)) return null;
                const keys = new Set();
                for (const w of d.words) {
                    const n = (w.n || '').trim(), qn = (w.qn || '').trim().replace(/\s+/g, ' ');
                    if (qn && n !== '.config' && /[一-鿿㐀-䶿\u{20000}-\u{323af}]/u.test(n)) keys.add(qn + '|' + n);
                }
                if (!keys.size) return null;
                let done = 0;
                for (const k of keys) if ((this.correct.get(k) || 0) >= 4) done++;
                return { done, total: keys.size };
            }

            // who published a public deck: "Chunom" for the decks of the site, else the user name
            byline(d, isPersonal) {
                if (isPersonal && !d.saved) return d.is_public ? ' · Published' : '';
                if (d.is_official) return ' · <span class="badge text-bg-warning align-text-bottom">chunom.org</span>';
                const name = this.owners && this.owners[d.user_id];
                return ` · by ${this.escape(name || 'a user')}`;
            }

            escape(text) {
                return String(text ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            setLoading(loading) {
                this.isCreating = loading;
                const btn = document.getElementById('submitCreateBtn');
                const text = document.getElementById('btnText');
                const spinner = document.getElementById('btnSpinner');
                const input = document.getElementById('deckTitleInput');

                if (loading) {
                    btn.disabled = true;
                    input.disabled = true;
                    text.textContent = "Creating...";
                    spinner.classList.remove('d-none');
                } else {
                    btn.disabled = false;
                    input.disabled = false;
                    text.textContent = "Create";
                    spinner.classList.add('d-none');
                }
            }

            // footer: who is signed in, with a sign-out link (nothing when not signed in)
            renderAccount() {
                const box = document.getElementById('account');
                box.replaceChildren();
                if (!this.signedIn()) return;
                // the words are tags of their own with data-vi, so they follow the language
                const label = document.createElement('span');
                label.setAttribute('data-vi', 'Đã đăng nhập:');
                label.textContent = 'Signed in as';
                const out = document.createElement('a');
                out.href = '#';
                const outText = document.createElement('span');
                outText.setAttribute('data-vi', 'Đăng xuất');
                outText.textContent = 'Sign out';
                out.append(outText);
                out.addEventListener('click', async e => { e.preventDefault(); await this.sp.signOut(); location.reload(); });
                box.append(label, ` ${this.sp.user.email || 'you'} · `, out);
            }

            signedIn() {
                return !!this.sp.user && !this.sp.isAnonymous;
            }

            async handleCreateDeck() {
                if (this.isCreating) return;
                if (!this.signedIn()) return QattLogin.open(this.sp, (window.Lang ? Lang.t('Sign in to create decks. The decks you have so far stay with your account.', 'Đăng nhập để tạo bộ thẻ. Các bộ thẻ bạn đã có sẽ được giữ trong tài khoản của bạn.') : 'Sign in to create decks. The decks you have so far stay with your account.'));
                const titleInput = document.getElementById('deckTitleInput');
                const title = titleInput.value.trim();
                if (!title) {
                    titleInput.classList.add('is-invalid');
                    return;
                }
                titleInput.classList.remove('is-invalid');
                this.setLoading(true);

                try {
                    const newId = crypto.randomUUID();
                    await this.sp.saveDeck({ id: newId, title: title, words: [] });
                    bootstrap.Modal.getInstance(document.getElementById('createDeckModal')).hide();
                    titleInput.value = '';
                    await this.loadLists();
                } catch (e) {
                    console.error("Creation failed:", e);
                }
                this.setLoading(false);
            }
        }

        const dashboard = new SuperlearningDashboard();
        window.onload = () => dashboard.init();
    </script>
</body>
</html>
