<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qatt.org - Practice / Decks</title>
    
    <!-- Bootstrap 5.3 -->
    <link href="https://qatt.org/qatt/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://qatt.org/qatt/vendor/bootstrap-icons/bootstrap-icons.min.css">
    
    <!-- Nom Fonts -->
    <link rel="stylesheet" href="https://qatt.org/chunom-assets/fonts/fonts.css">

    <script src="https://qatt.org/qatt/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://qatt.org/qatt/vendor/supabase/supabase.min.js"></script>
    <script src="../../qatt/js/navigation.js"></script>
    <script src="../../qatt/js/supabase.js"></script>
    <script src="deck-cover.js"></script>
    <script src="../../qatt/js/login.js"></script>

    <style>
        :root { --ink: #2b2118; --cinnabar: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; }

        body {
            min-height: 100vh;
            color: var(--ink);
            background: linear-gradient(180deg, var(--paper) 0, #fffdf8 18rem) no-repeat, #fffdf8;
        }

        .page-title { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2rem, 7vw, 2.8rem); }
        .accent { color: var(--cinnabar) !important; }
        .btn-outline-accent { color: var(--cinnabar); border-color: var(--cinnabar); }
        .btn-outline-accent:hover { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }
        .text-secondary { color: var(--muted) !important; }

        /* quiet text buttons without hover or focus highlights */
        .btn-subtle {
            all: unset;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.6rem;
            cursor: pointer;
            color: var(--muted);
            font-size: 0.925rem;
            font-weight: 500;
            user-select: none;
            border-radius: 2rem;
        }
        .btn-subtle:hover { color: var(--cinnabar); }
        .btn-subtle:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 2px; }

        /* deck cards */
        .list-group { border: none !important; }
        .list-group-item {
            background-color: rgba(255, 255, 255, .8) !important;
            border: 1px solid var(--line) !important;
            border-radius: .8rem !important;
            color: var(--ink);
            margin-bottom: 0.6rem;
            transition: border-color .15s, box-shadow .15s;
        }
        .deck-thumb { width: 4rem; height: 4rem; object-fit: cover; border-radius: .9rem; flex: none; }
        .deck-title { font-weight: 600; color: var(--ink); }
        .empty-box { background: rgba(255, 255, 255, .6); border: 1px dashed var(--field); }

        .section-header { border: none !important; }
        .account-footer { margin-top: 3rem; text-align: center; font-size: .85rem; color: var(--muted); }
        .account-footer a { color: var(--cinnabar); text-decoration: none; }
        .account-footer a:hover { text-decoration: underline; }
        .section-header h6 { letter-spacing: .12em; }

        /* modal */
        .modal-content { background: #fffdf8; color: var(--ink); border-radius: 1rem; }
        .modal-content .form-control { border-color: var(--field); background-color: #fff; color: var(--ink); }
        .modal-content .form-control:focus { border-color: var(--cinnabar); box-shadow: 0 0 0 .2rem rgba(168, 54, 42, .15) !important; }
        .btn-cinnabar { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; border-radius: 2rem; }
        .btn-cinnabar:hover, .btn-cinnabar:focus-visible { background: #8c2c22; border-color: #8c2c22; color: #fff; }
        .btn-cancel { border-radius: 2rem; background: #fff; border: 1px solid var(--field); color: var(--ink); }
        .btn-cancel:hover { background: #f1e8d2; color: var(--ink); }
    </style>
</head>
<body>

    <div class="container py-3 pb-5" style="max-width: 62rem">
        <div class="row justify-content-center text-center">
            <div class="col-lg-10">
                
                <!-- Header -->
                <h1 class="page-title mt-2 mb-2">Practice / Decks</h1>
                <p class="text-secondary mx-auto mb-5" style="max-width: 36rem">Practice Chữ Nôm with the words of your own and public decks.</p>
                

                <!-- Personal Decks Section -->
                <div class="text-start mb-5">
                    <div class="d-flex justify-content-between align-items-center pb-2 mb-3 section-header">
                        <div class="d-flex align-items-center gap-2">
                            <h6 class="text-secondary text-uppercase mb-0 small">My Decks</h6>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn-subtle" data-bs-toggle="modal" data-bs-target="#createDeckModal">
                                <i class="bi bi-plus-lg"></i>
                                <span>Add</span>
                            </button>
                        </div>
                    </div>

                    <div id="deck-list" class="list-group">
                        <div class="text-center p-5 text-secondary rounded">
                            <div class="spinner-border spinner-border-sm accent mb-2" role="status"></div>
                            <div class="small">Loading personal decks...</div>
                        </div>
                    </div>
                </div>

                <!-- Public Decks Section -->
                <div class="text-start mb-5">
                    <h6 class="text-secondary text-uppercase pb-2 mb-3 small section-header">
                        Public Decks
                    </h6>
                    <div id="public-deck-list" class="list-group">
                        <div class="text-center p-5 text-secondary">
                            <div class="spinner-border spinner-border-sm accent mb-2" role="status"></div>
                            <div class="small">Loading public decks...</div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
        <footer id="account" class="account-footer"></footer>
    </div>

    <!-- Create Deck Modal -->
    <div class="modal fade" id="createDeckModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="modal-title">New Deck</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body border-0">
                    <div class="mb-3">
                        <label for="deckTitleInput" class="form-label text-secondary small text-uppercase">Deck Title</label>
                        <input type="text" class="form-control shadow-none" id="deckTitleInput" placeholder="e.g. Basic Verbs">
                        <div class="invalid-feedback">Please enter a title.</div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-cancel shadow-none" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-cinnabar px-4 fw-bold shadow-none" id="submitCreateBtn">
                        <span id="btnText">Create</span>
                        <div id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class SuperlearningDashboard {
            constructor() {
                this.sp = new SupabaseService();
                this.isCreating = false;
                this.personalDecks = [];
                this.publicDecks = [];
            }

            async init() {
                try {
                    await this.sp.init();
                    this.renderAccount();
                    this.setupEventListeners();
                    await this.loadLists();
                } catch (e) {
                    console.error("Dashboard Init Error:", e);
                }
            }

            setupEventListeners() {
                const modalEl = document.getElementById('createDeckModal');
                const titleInput = document.getElementById('deckTitleInput');
                const submitBtn = document.getElementById('submitCreateBtn');

                // new decks only with a login: anonymous users get the sign-in dialog instead
                modalEl.addEventListener('show.bs.modal', e => {
                    if (!this.signedIn()) {
                        e.preventDefault();
                        QattLogin.open(this.sp, 'Sign in to create decks. The decks you have so far stay with your account.');
                    }
                });
                modalEl.addEventListener('shown.bs.modal', () => titleInput.focus());
                modalEl.addEventListener('hidden.bs.modal', () => {
                    if (!this.isCreating) {
                        titleInput.value = '';
                        titleInput.classList.remove('is-invalid');
                    }
                });

                submitBtn.addEventListener('click', () => this.handleCreateDeck());
                titleInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !this.isCreating) this.handleCreateDeck();
                });
            }

            async loadLists() {
                const [own, saved, publicDecks] = await Promise.all([
                    this.sp.getDecks() || [],
                    this.sp.getSavedDecks?.() || [],
                    this.sp.getPublicDecks() || []
                ]);
                // taken-over public decks are in "My decks", not in the catalog
                const savedIds = new Set(saved.map(d => d.id));
                this.owners = await this.sp.getUsernames?.([...saved, ...publicDecks].map(d => d.user_id)) || {};
                this.personalDecks = [...own, ...saved];
                this.publicDecks = publicDecks.filter(d => !savedIds.has(d.id));

                // one list failing must not keep the other from showing
                for (const [id, list, mine] of [['deck-list', this.personalDecks, true], ['public-deck-list', this.publicDecks, false]]) {
                    try { this.renderList(id, list, mine); } catch (e) { console.error(`Rendering ${id} failed:`, e); }
                }
            }

            renderList(containerId, data, isPersonal) {
                const el = document.getElementById(containerId);
                if (!data || data.length === 0) {
                    let emptyHtml = '<div class="p-4 text-center text-secondary rounded-3 small empty-box">';
                    if (containerId !== 'deck-list') {
                        emptyHtml += 'No decks found.';
                    } else if (this.signedIn()) {
                        emptyHtml += `No decks found.
                            <div class="mt-2">
                                <button class="btn btn-sm btn-link accent text-decoration-none p-0 border-0 shadow-none"
                                        data-bs-toggle="modal" data-bs-target="#createDeckModal">
                                    Create your first deck now
                                </button>
                            </div>`;
                    } else {
                        emptyHtml += `Sign in to see your own decks.
                            <div class="mt-2"><button type="button" class="btn btn-sm btn-cinnabar rounded-pill px-3" id="signin-decks">Sign in</button></div>`;
                    }
                    emptyHtml += `</div>`;
                    el.innerHTML = emptyHtml;
                    el.querySelector('#signin-decks')?.addEventListener('click', () => QattLogin.open(this.sp));
                    return;
                }

                el.innerHTML = data.map(d => `
                    <div class="list-group-item py-3 mb-2 rounded shadow-none">
                        <div class="d-flex align-items-start gap-3">
                            <span class="deck-thumb-slot" data-deck="${d.id}"></span>
                            <div class="text-start">
                                <div class="deck-title">${this.escape(d.title)}</div>
                                <small class="text-secondary">${d.words ? d.words.length : (d.count || 0)} items${this.byline(d, isPersonal)}</small>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-2 mt-3">
                            <a href="immersive.html?id=${d.id}" class="btn btn-sm btn-cinnabar px-3"><i class="bi bi-headphones me-1"></i> Superlearn</a>
                            <a href="practice.html?id=${d.id}" class="btn btn-sm btn-outline-accent rounded-pill px-3"><i class="bi bi-lightning-charge-fill"></i> Practice</a>
                            ${d.saved ? `<button type="button" class="btn btn-sm btn-link text-secondary text-decoration-none ms-auto" data-remove="${d.id}"><i class="bi bi-x-lg me-1"></i>Remove</button>` : '<span class="ms-auto"></span>'}
                            <a href="deck.html?id=${d.id}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">Details</a>
                        </div>
                    </div>
                `).join('');
                el.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', async () => {
                    const d = data.find(x => x.id === btn.dataset.remove);
                    if (!confirm(`Remove "${d.title}" from My decks? Your progress is kept.`)) return;
                    btn.disabled = true;
                    const { error } = await this.sp.removeSavedDeck(d.id);
                    if (error) { btn.disabled = false; alert('Could not remove the deck, please try again.'); return; }
                    this.loadLists();
                }));
                el.querySelectorAll('.deck-thumb-slot').forEach(slot => {
                    const d = data.find(x => x.id === slot.dataset.deck);
                    if (window.DeckCover) slot.replaceWith(DeckCover.element(d, this.sp.deckImageUrl(d.image_path), 'deck-thumb'));
                    else slot.remove(); // deck-cover.js not loaded (yet): the list works without thumbnails
                });
            }

            // who published a public deck: "Chunom" for the decks of the site, else the user name
            byline(d, isPersonal) {
                if (isPersonal && !d.saved) return d.is_public ? ' · Published' : '';
                if (d.is_official) return ' · <span class="badge text-bg-warning align-text-bottom">chunom.org</span>';
                const name = this.owners && this.owners[d.user_id];
                return ` · by ${this.escape(name || 'a user')}`;
            }

            escape(text) {
                return String(text ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            setLoading(loading) {
                this.isCreating = loading;
                const btn = document.getElementById('submitCreateBtn');
                const text = document.getElementById('btnText');
                const spinner = document.getElementById('btnSpinner');
                const input = document.getElementById('deckTitleInput');

                if (loading) {
                    btn.disabled = true;
                    input.disabled = true;
                    text.textContent = "Creating...";
                    spinner.classList.remove('d-none');
                } else {
                    btn.disabled = false;
                    input.disabled = false;
                    text.textContent = "Create";
                    spinner.classList.add('d-none');
                }
            }

            // footer: who is signed in, with a sign-out link (nothing when not signed in)
            renderAccount() {
                const box = document.getElementById('account');
                box.replaceChildren();
                if (!this.signedIn()) return;
                const out = document.createElement('a');
                out.href = '#';
                out.textContent = 'Sign out';
                out.addEventListener('click', async e => { e.preventDefault(); await this.sp.signOut(); location.reload(); });
                box.append(`Signed in as ${this.sp.user.email || 'you'} · `, out);
            }

            signedIn() {
                return !!this.sp.user && !this.sp.isAnonymous;
            }

            async handleCreateDeck() {
                if (this.isCreating) return;
                if (!this.signedIn()) return QattLogin.open(this.sp, 'Sign in to create decks. The decks you have so far stay with your account.');
                const titleInput = document.getElementById('deckTitleInput');
                const title = titleInput.value.trim();
                if (!title) {
                    titleInput.classList.add('is-invalid');
                    return;
                }
                titleInput.classList.remove('is-invalid');
                this.setLoading(true);

                try {
                    const newId = crypto.randomUUID();
                    await this.sp.saveDeck({ id: newId, title: title, words: [] });
                    bootstrap.Modal.getInstance(document.getElementById('createDeckModal')).hide();
                    titleInput.value = '';
                    await this.loadLists();
                } catch (e) {
                    console.error("Creation failed:", e);
                }
                this.setLoading(false);
            }
        }

        const dashboard = new SuperlearningDashboard();
        window.onload = () => dashboard.init();
    </script>
</body>
</html>
