<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qatt.org - Flashcards Dashboard</title>
    
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Nom Fonts -->
    <link rel="stylesheet" href="https://chunom.org/media/css/fonts/all.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../qatt/js/navigation.js"></script>
    <script src="../../qatt/js/supabase.js?v=6"></script>
    <script src="../../qatt/js/login.js?v=3"></script>

    <style>
        :root { --ink: #2b2118; --cinnabar: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; }

        body {
            min-height: 100vh;
            color: var(--ink);
            background: linear-gradient(180deg, var(--paper) 0, #fffdf8 18rem) no-repeat, #fffdf8;
        }

        .page-title { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2rem, 7vw, 2.8rem); }
        .page-han { color: var(--cinnabar); letter-spacing: .5em; padding-left: .5em; font-size: 1.05rem; }
        .accent { color: var(--cinnabar) !important; }
        .btn-outline-accent { color: var(--cinnabar); border-color: var(--cinnabar); }
        .btn-outline-accent:hover { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }
        .text-secondary { color: var(--muted) !important; }

        /* quiet text buttons without hover or focus highlights */
        .btn-subtle {
            all: unset;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.6rem;
            cursor: pointer;
            color: var(--muted);
            font-size: 0.925rem;
            font-weight: 500;
            user-select: none;
            border-radius: 2rem;
        }
        .btn-subtle:hover { color: var(--cinnabar); }
        .btn-subtle:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 2px; }

        /* deck menu (edit, delete) */
        .deck-menu-btn { color: var(--muted); border: 0; background: none; padding: .2rem .5rem; border-radius: 2rem; }
        .deck-menu-btn:hover, .deck-menu-btn:focus-visible { color: var(--cinnabar); background: rgba(168, 54, 42, .08); }
        .dropdown-menu { border-color: var(--line); border-radius: .8rem; }

        /* edit dialog: entries of a deck */
        .entry-row { display: flex; align-items: center; gap: .8rem; padding: .4rem .2rem; border-bottom: 1px solid var(--line); }
        .entry-row .glyph { min-width: 2.5rem; text-align: center; font-family: 'Nom Na Tong Supplement', 'pa', serif; font-size: 1.6rem; }
        .entry-row .btn-remove { color: var(--muted); border: 0; background: none; padding: .2rem .5rem; border-radius: 2rem; }
        .entry-row .btn-remove:hover, .entry-row .btn-remove:focus-visible { color: var(--cinnabar); background: rgba(168, 54, 42, .08); }

        /* deck cards */
        .list-group { border: none !important; }
        .list-group-item {
            background-color: rgba(255, 255, 255, .8) !important;
            border: 1px solid var(--line) !important;
            border-radius: .8rem !important;
            color: var(--ink);
            margin-bottom: 0.6rem;
            transition: border-color .15s, box-shadow .15s;
        }
        .deck-title { font-weight: 600; color: var(--ink); }
        .empty-box { background: rgba(255, 255, 255, .6); border: 1px dashed var(--field); }

        .section-header { border: none !important; }
        .section-header h6 { letter-spacing: .12em; }

        /* modal */
        .modal-content { background: #fffdf8; color: var(--ink); border-radius: 1rem; }
        .modal-content .form-control { border-color: var(--field); background-color: #fff; color: var(--ink); }
        .modal-content .form-control:focus { border-color: var(--cinnabar); box-shadow: 0 0 0 .2rem rgba(168, 54, 42, .15) !important; }
        .btn-cinnabar { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; border-radius: 2rem; }
        .btn-cinnabar:hover, .btn-cinnabar:focus-visible { background: #8c2c22; border-color: #8c2c22; color: #fff; }
        .btn-cancel { border-radius: 2rem; background: #fff; border: 1px solid var(--field); color: var(--ink); }
        .btn-cancel:hover { background: #f1e8d2; color: var(--ink); }
    </style>
</head>
<body>

    <div class="container py-3">
        <div class="row justify-content-center text-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Header -->
                <div class="page-han mt-2">國音新字</div>
                <h1 class="page-title mb-5">Flashcards</h1>
                
                <!-- Personal Decks Section -->
                <div class="text-start mb-5">
                    <div class="d-flex justify-content-between align-items-center pb-2 mb-3 section-header">
                        <div class="d-flex align-items-center gap-2">
                            <h6 class="text-secondary text-uppercase mb-0 small">My Decks</h6>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn-subtle" data-bs-toggle="modal" data-bs-target="#createDeckModal">
                                <i class="bi bi-plus-lg"></i>
                                <span>Add</span>
                            </button>
                        </div>
                    </div>
                    <div id="account" class="mb-3"></div>

                    <div id="deck-list" class="list-group">
                        <div class="text-center p-5 text-secondary rounded">
                            <div class="spinner-border spinner-border-sm accent mb-2" role="status"></div>
                            <div class="small">Loading personal decks...</div>
                        </div>
                    </div>
                </div>

                <!-- Public Decks Section -->
                <div class="text-start mb-5">
                    <h6 class="text-secondary text-uppercase pb-2 mb-3 small section-header">
                        Public Decks
                    </h6>
                    <div id="public-deck-list" class="list-group">
                        <div class="text-center p-5 text-secondary">
                            <div class="spinner-border spinner-border-sm accent mb-2" role="status"></div>
                            <div class="small">Loading public decks...</div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Create Deck Modal -->
    <div class="modal fade" id="createDeckModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="modal-title">New Deck</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body border-0">
                    <div class="mb-3">
                        <label for="deckTitleInput" class="form-label text-secondary small text-uppercase">Deck Title</label>
                        <input type="text" class="form-control shadow-none" id="deckTitleInput" placeholder="e.g. Basic Verbs">
                        <div class="invalid-feedback">Please enter a title.</div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-cancel shadow-none" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-cinnabar px-4 fw-bold shadow-none" id="submitCreateBtn">
                        <span id="btnText">Create</span>
                        <div id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Deck Modal -->
    <div class="modal fade" id="editDeckModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Edit Deck</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body border-0">
                    <div class="mb-4">
                        <label for="editTitleInput" class="form-label text-secondary small text-uppercase">Deck Title</label>
                        <input type="text" class="form-control shadow-none" id="editTitleInput" maxlength="80">
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <h6 class="text-secondary text-uppercase mb-0 small">Characters</h6>
                        <span id="editCount" class="text-secondary small"></span>
                    </div>
                    <div id="editWords"></div>
                    <p class="text-secondary small mt-3 mb-0">Add characters in the dictionary: open a character and tap the heart.</p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-cancel shadow-none" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-cinnabar px-4 fw-bold shadow-none" id="saveEditBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class SuperlearningDashboard {
            constructor() {
                this.sp = new SupabaseService();
                this.isCreating = false;
                this.personalDecks = [];
                this.publicDecks = [];
            }

            async init() {
                try {
                    await this.sp.init();
                    QattLogin.status(this.sp, document.getElementById('account'));
                    this.setupEventListeners();
                    await this.loadLists();
                } catch (e) {
                    console.error("Dashboard Init Error:", e);
                }
            }

            setupEventListeners() {
                const modalEl = document.getElementById('createDeckModal');
                const titleInput = document.getElementById('deckTitleInput');
                const submitBtn = document.getElementById('submitCreateBtn');

                // new decks only with a login: anonymous users get the sign-in dialog instead
                modalEl.addEventListener('show.bs.modal', e => {
                    if (!this.signedIn()) {
                        e.preventDefault();
                        QattLogin.open(this.sp, 'Sign in to create decks. The decks you have so far stay with your account.');
                    }
                });
                modalEl.addEventListener('shown.bs.modal', () => titleInput.focus());
                modalEl.addEventListener('hidden.bs.modal', () => {
                    if (!this.isCreating) {
                        titleInput.value = '';
                        titleInput.classList.remove('is-invalid');
                    }
                });

                document.getElementById('deck-list').addEventListener('click', e => {
                    const del = e.target.closest('[data-delete-deck]');
                    if (del) this.deleteDeck(del.dataset.deleteDeck);
                    const edit = e.target.closest('[data-edit-deck]');
                    if (edit) this.openEdit(edit.dataset.editDeck);
                });
                document.getElementById('saveEditBtn').addEventListener('click', () => this.saveEdit());

                submitBtn.addEventListener('click', () => this.handleCreateDeck());
                titleInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !this.isCreating) this.handleCreateDeck();
                });
            }

            async loadLists() {
                const [personal, publicDecks] = await Promise.all([
                    this.sp.getDecks() || [],
                    this.sp.getPublicDecks() || []
                ]);
                this.personalDecks = personal;
                this.publicDecks = publicDecks;

                this.renderList('deck-list', this.personalDecks, true);
                this.renderList('public-deck-list', this.publicDecks, false);
            }

            renderList(containerId, data, isPersonal) {
                const el = document.getElementById(containerId);
                if (!data || data.length === 0) {
                    let emptyHtml = `
                        <div class="p-4 text-center text-secondary rounded-3 small empty-box">
                            No decks found.`;
                    
                    if (containerId === 'deck-list') {
                        emptyHtml += `
                            <div class="mt-2">
                                <button class="btn btn-sm btn-link accent text-decoration-none p-0 border-0 shadow-none" 
                                        data-bs-toggle="modal" data-bs-target="#createDeckModal">
                                    Create your first deck now
                                </button>
                            </div>`;
                    }
                    emptyHtml += `</div>`;
                    el.innerHTML = emptyHtml;
                    return;
                }

                el.innerHTML = data.map(d => `
                    <div class="list-group-item py-3 mb-2 rounded shadow-none">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="text-start">
                                <div class="deck-title">${this.escape(d.title)}</div>
                                <small class="text-secondary">${d.words ? d.words.length : (d.count || 0)} items</small>
                            </div>
                            ${isPersonal ? `
                            <div class="dropdown">
                                <button type="button" class="deck-menu-btn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Deck menu"><i class="bi bi-three-dots-vertical"></i></button>
                                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                    <li><button type="button" class="dropdown-item" data-edit-deck="${d.id}"><i class="bi bi-pencil me-2"></i>Edit</button></li>
                                    <li><button type="button" class="dropdown-item text-danger" data-delete-deck="${d.id}"><i class="bi bi-trash me-2"></i>Delete</button></li>
                                </ul>
                            </div>` : ''}
                        </div>
                        <div class="d-flex flex-wrap gap-2 mt-3">
                            <a href="immersive.html?id=${d.id}" class="btn btn-sm btn-cinnabar px-3"><i class="bi bi-headphones me-1"></i> Superlearn</a>
                            <a href="practice.html?id=${d.id}" class="btn btn-sm btn-outline-accent rounded-pill px-3"><i class="bi bi-lightning-charge-fill"></i> Practice</a>
                        </div>
                    </div>
                `).join('');
            }

            escape(text) {
                return String(text ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            // a character as image with the font as fallback, like in the dictionary
            glyph(nom) {
                const box = document.createElement('span');
                box.className = 'glyph';
                if (!/^[\u4e00-\u9fff\u3400-\u4dbf\u{20000}-\u{323af}]$/u.test(nom)) {
                    box.textContent = nom;
                    return box;
                }
                const img = new Image(32, 32);
                img.alt = nom;
                img.style.verticalAlign = 'middle';
                const hex = nom.codePointAt(0).toString(16).toUpperCase();
                img.addEventListener('error', () => {
                    if (img.src.includes('chunom.org')) img.replaceWith(nom);
                    else img.src = `https://chunom.org/media/generated/${hex}-32.png`;
                });
                img.src = `https://qatt.org/chunom-assets/generated/32/${hex}.webp`;
                box.append(img);
                return box;
            }

            async openEdit(id) {
                const deck = await this.sp.getDeck(id);
                if (!deck.id || deck.user_id !== this.sp.user?.id) return;
                this.editing = { id: deck.id, words: deck.words || [], removed: new Set() };
                document.getElementById('editTitleInput').value = deck.title || '';
                this.renderEditWords();
                bootstrap.Modal.getOrCreateInstance(document.getElementById('editDeckModal')).show();
            }

            renderEditWords() {
                const { words, removed } = this.editing;
                const shown = words.filter(w => w.n !== '.config' && !removed.has(w));
                document.getElementById('editCount').textContent = `${shown.length} items`;
                const rows = shown.map(word => {
                    const qn = document.createElement('span');
                    qn.className = 'flex-grow-1';
                    qn.lang = 'vi';
                    qn.textContent = word.qn || '';
                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.className = 'btn-remove';
                    remove.title = 'Remove';
                    remove.setAttribute('aria-label', 'Remove');
                    remove.innerHTML = '<i class="bi bi-trash"></i>';
                    remove.addEventListener('click', () => { removed.add(word); this.renderEditWords(); });
                    const row = document.createElement('div');
                    row.className = 'entry-row';
                    row.append(this.glyph(word.n || ''), qn, remove);
                    return row;
                });
                if (!rows.length) {
                    const empty = document.createElement('div');
                    empty.className = 'p-4 text-center text-secondary small empty-box rounded-3';
                    empty.textContent = 'This deck is empty.';
                    rows.push(empty);
                }
                document.getElementById('editWords').replaceChildren(...rows);
            }

            async saveEdit() {
                const { id, words, removed } = this.editing;
                const btn = document.getElementById('saveEditBtn');
                btn.disabled = true;
                const title = document.getElementById('editTitleInput').value.trim() || 'Untitled Deck';
                const { error } = await this.sp.saveDeck({ id, title, words: words.filter(w => !removed.has(w)) });
                btn.disabled = false;
                if (error) return alert('Could not save the deck, please try again.');
                bootstrap.Modal.getInstance(document.getElementById('editDeckModal')).hide();
                await this.loadLists();
            }

            async deleteDeck(id) {
                const deck = this.personalDecks.find(d => d.id === id);
                if (!deck || !confirm(`Delete the deck "${deck.title}"? This cannot be undone.`)) return;
                const { error } = await this.sp.deleteDeck(id);
                if (error) return alert('Could not delete the deck, please try again.');
                await this.loadLists();
            }

            setLoading(loading) {
                this.isCreating = loading;
                const btn = document.getElementById('submitCreateBtn');
                const text = document.getElementById('btnText');
                const spinner = document.getElementById('btnSpinner');
                const input = document.getElementById('deckTitleInput');

                if (loading) {
                    btn.disabled = true;
                    input.disabled = true;
                    text.textContent = "Creating...";
                    spinner.classList.remove('d-none');
                } else {
                    btn.disabled = false;
                    input.disabled = false;
                    text.textContent = "Create";
                    spinner.classList.add('d-none');
                }
            }

            signedIn() {
                return !!this.sp.user && !this.sp.isAnonymous;
            }

            async handleCreateDeck() {
                if (this.isCreating) return;
                if (!this.signedIn()) return QattLogin.open(this.sp, 'Sign in to create decks. The decks you have so far stay with your account.');
                const titleInput = document.getElementById('deckTitleInput');
                const title = titleInput.value.trim();
                if (!title) {
                    titleInput.classList.add('is-invalid');
                    return;
                }
                titleInput.classList.remove('is-invalid');
                this.setLoading(true);

                try {
                    const newId = crypto.randomUUID();
                    await this.sp.saveDeck({ id: newId, title: title, words: [] });
                    bootstrap.Modal.getInstance(document.getElementById('createDeckModal')).hide();
                    titleInput.value = '';
                    await this.loadLists();
                } catch (e) {
                    console.error("Creation failed:", e);
                }
                this.setLoading(false);
            }
        }

        const dashboard = new SuperlearningDashboard();
        window.onload = () => dashboard.init();
    </script>
</body>
</html>
