<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deck Practice | Chunom.org</title>
  <link href="https://qatt.org/qatt/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://qatt.org/chunom-assets/fonts/fonts.css">
  <script src="../../qatt/js/navigation.js"></script>
  <script src="../../qatt/js/qatt.js"></script>
  <script src="../../qatt/js/parser.js"></script>
  <script src="../../qatt/js/supabase.js"></script>
  <script src="../../qatt/js/login.js"></script>
  <script src="https://qatt.org/qatt/vendor/supabase/supabase.min.js"></script>
  <link  href="../css/practice.css" rel="stylesheet">
  <script src="../js/detail.js"></script>
  <script src="../js/practice.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
// Practice of a deck (?id=…): the practice of qatt.org with the words of the deck as one lesson.
// Questions and answers come in the forms Nôm characters and quốc ngữ; the score goes to the same leaderboard.
async function main() {
  const FORMS = ["nom", "text"]; // the practice of chunom asks Nôm characters and quốc ngữ, no glyphs
  const app = await App.init(document.getElementById("app"), { forms: FORMS, requireLogin: true });
  if (!app) return; // not signed in: the page asks for the login
  window.app = app;
  app.backUrl = "index.html";
  const box = document.getElementById("app-container");

  const id = new URLSearchParams(location.search).get("id");
  const deck = id ? await app.db.getDeck(id) : null;

  // one item per word: the key identifies it, the same quốc ngữ with different characters stay apart
  const items = {};
  (deck?.words || []).forEach(w => {
    const n = (w.n || "").trim(), qn = (w.qn || "").trim().replace(/\s+/g, " ");
    if (!qn || n === ".config") return;
    items[qn + "|" + n] = { n, qn };
  });
  Object.assign(app.items, items);
  // a word needs one of the other forms besides its quốc ngữ, or there is nothing to ask for
  const symbols = Object.keys(items).filter(key => FORMS.some(form => form !== "text" && app.formValue(key, form) !== null));

  if (symbols.length < 4) {
    box.innerHTML = `<div class="card p-4 text-center"><h5 class="mb-3">${deck ? "This deck needs at least 4 words with Nôm characters to practise." : "Deck not found."}</h5>
      <a class="btn btn-info" href="index.html">← Decks</a></div>`;
    return;
  }

  document.title = `${deck.title} | Practice | Chunom.org`;
  app.addLesson({
    id: "deck-" + deck.id,
    category: "Deck",
    name: deck.title,
    classes: "bg-primary",
    items,
    symbols
  });
  app.renderLessonPreview("deck-" + deck.id, true);
}
main();
  </script>
</body>
</html>
