<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chữ Nôm Writer | Qatt.org</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link type="text/css" href="https://chunom.org/media/css/fonts/all.css" rel="stylesheet"/>
    <script defer src="js/ime.js?v=20261011-0447"></script>
    <script defer src="../qatt/js/navigation.js"></script>

    <style>
        :root { --ink: #2b2118; --accent: #a8362a; --paper: #f7efdc; --line: #e4d9c0; }

        body {
            background: linear-gradient(180deg, var(--paper) 0, #fffdf8 16rem) no-repeat, #fffdf8;
            color: var(--ink);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        .writer-head h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(1.7rem, 6vw, 2.4rem); }
        .writer-head p { color: #5b4d3d; max-width: 36rem; margin-inline: auto; }

        /* the writing card */
        .writer {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 1rem;
            box-shadow: 0 .5rem 1.5rem rgba(60, 40, 20, .08);
            overflow: hidden;
        }
        .writer-pad { padding: .25rem; }
        #typer-text {
            display: block;
            width: 100%;
            min-height: 9.5rem;
            padding: .75rem .9rem;
            font-size: 1.5rem;
            line-height: 1.5;
            border: none;
            outline: none;
            background: transparent;
            color: var(--ink);
            resize: none;
        }
        .writer-bar {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .4rem .6rem;
            border-top: 1px solid var(--line);
            background: #fcf8ee;
        }
        .writer-bar .btn { border-radius: 2rem; font-size: .85rem; padding: .25rem .8rem; }
        .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-accent:hover, .btn-accent:focus-visible { background: #8c2c22; border-color: #8c2c22; color: #fff; }
        .btn-quiet { border-color: #cdbf9f; color: #5b4d3d; background: #fff; }
        .btn-quiet:hover { background: #f1e8d2; color: var(--ink); border-color: #b9a982; }

        /* info box under the writing card */
        .info { margin-top: 1rem; padding: .8rem 1rem; border: 1px solid var(--line); border-radius: .8rem; background: rgba(255, 255, 255, .7); color: #5b4d3d; font-size: .92rem; }
        .info b { color: var(--ink); font-weight: 600; }
        .info .ex { font-size: 1.15rem; white-space: nowrap; }
        .info ol { margin: 0; padding-left: 1.2rem; }
        .info li + li { margin-top: .2rem; }

        /* floating candidate list: ime.js puts it under the text field, the page only styles it */
        :root {
            --vietime-bg: #fff;
            --vietime-color: var(--ink);
            --vietime-border: 1px solid var(--line);
            --vietime-grid: transparent;
            --vietime-active: rgba(168, 54, 42, .10);
            --vietime-remainder: var(--accent);
        }
        .vietime {
            padding: .3rem;
            border-radius: .8rem;
            box-shadow: 0 .6rem 1.6rem rgba(60, 40, 20, .22);
            font-family: system-ui, -apple-system, sans-serif;
            width: calc(100vw - 2.1rem);
        }
        .vietime:not([hidden]) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .15rem; }
        .vietime-option { border-top: none; border-radius: .6rem; min-height: 2.7rem; line-height: 1.2; padding: .15rem .5rem; gap: .4rem; overflow: hidden; }
        .vietime-option[aria-selected="true"] { box-shadow: inset 0 0 0 1.5px rgba(168, 54, 42, .45); }
        .vietime-number { flex: none; width: 1.3rem; text-align: right; font-size: .75rem; color: #9a8a70; font-variant-numeric: tabular-nums; }
        .vietime-glyph { flex: none; font-size: 1.7rem; line-height: 1; }
        .vietime-reading { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .vietime-definition { display: none; }

        .info kbd { background: #f1e8d2; color: #5b4d3d; font-size: .75rem; padding: .05rem .35rem; }

        .opts { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem 1.2rem; }
        .opts .form-check { margin: 0; }
        .opts .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
        .opts .form-check-label { font-size: .9rem; color: #5b4d3d; }

        /* phones: compact top so the list under the field stays above the keyboard */
        @media (max-width: 575.98px) {
            .writer-head { margin-block: .5rem !important; }
            .writer-head p { display: none; }
            #typer-text { min-height: 6.2rem; }
        }
        @media (min-width: 576px) {
            .vietime { width: auto; min-width: 16em; max-width: 28em; }
            .vietime:not([hidden]) { grid-template-columns: 1fr; gap: .05rem; }
            .vietime-definition { display: block; max-width: 10em; }
            #typer-text { min-height: 9rem; font-size: 1.7rem; }
        }
    </style>
</head>
<body>

<div class="container py-3 pb-5" style="max-width: 62rem">

    <header class="writer-head text-center my-3">
        <h1 class="mb-1">Chữ Nôm Writer</h1>
        <p class="mb-0">Type Vietnamese with Telex, then pick the Nôm character that fits.</p>
    </header>

    <div class="writer">
        <div class="writer-pad">
            <textarea id="typer-text" placeholder="Type here…" aria-label="Text"></textarea>
        </div>

        <div class="writer-bar">
            <button type="button" class="btn btn-accent" id="copy-btn"><i class="bi bi-clipboard"></i> Copy</button>
            <button type="button" class="btn btn-quiet" id="clear-btn"><i class="bi bi-x-lg"></i> Clear</button>
        </div>

    </div>

    <div class="info">
        <ol>
            <li>Type a syllable with Telex, for example <b>viet</b> → <span class="ex">việt</span>.</li>
            <li>A list of Nôm characters appears below the text field: tap one, or press <kbd>1</kbd>–<kbd>0</kbd>.
                <span class="d-none d-lg-inline">With <kbd>↑</kbd><kbd>↓</kbd> you move through the list, <kbd>Esc</kbd> closes it.</span></li>
        </ol>
    </div>

    <div class="opts mt-3">
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="telex-select" checked>
            <label class="form-check-label" for="telex-select">Telex</label>
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="return-select" checked>
            <label class="form-check-label" for="return-select">Enter picks the first</label>
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="space-select" checked>
            <label class="form-check-label" for="space-select">Space picks the first</label>
        </div>
    </div>

</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const typer = document.getElementById('typer-text');
        const switches = {
            telex: document.getElementById('telex-select'),
            returnSelect: document.getElementById('return-select'),
            spaceSelect: document.getElementById('space-select')
        };
        const options = () => Object.fromEntries(Object.entries(switches).map(([name, box]) => [name, box.checked]));

        const ime = new VietIme(typer, options());
        for (const box of Object.values(switches)) {
            box.addEventListener('change', () => {
                ime.update(options());
                typer.focus();
            });
        }

        const copyBtn = document.getElementById('copy-btn');
        copyBtn.addEventListener('click', async () => {
            const label = copyBtn.innerHTML;
            try {
                await navigator.clipboard.writeText(typer.value);
            } catch {
                typer.select();
                document.execCommand('copy');
            }
            copyBtn.innerHTML = '<i class="bi bi-check-lg"></i> Copied';
            setTimeout(() => { copyBtn.innerHTML = label; }, 1400);
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            typer.value = '';
            typer.dispatchEvent(new Event('input', { bubbles: true }));
            typer.focus();
        });

        typer.focus();
    });
</script>

</body>
</html>
